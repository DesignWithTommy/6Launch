# Launcher spec for vendor/rdna: XaviFortes's VIctory-RDNA (RDNA3-tuned VIctory, RX 7900 XT).
# Build, run and env are its README and scripts/play-rdna.ps1 + rdna-preset.json (default: base + fast, Series X).
name = "rdna"
fork = "VIctory"
gpu = "AMD"   # the card it is tuned for (README "Tuned for"; the picker's filter)
rank = 6   # i95 rank: score 68.1 by PortWatch VI's formula (from the author's report; scripts/rank.py)
about = "VIctory-RDNA c0d38c3 (GPL-3.0): 19.1 to 23.1 fps medians at Series X 4K in one capture under 10 minutes, RX 7900 XT; about 40 minutes by hand on earlier builds; not yet run here"
upstream = "https://github.com/XaviFortes/VIctory-RDNA"
updated = "2026-11-27 16:51"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 26   # GitHub stars when last checked
build = ["cargo", "build", "--locked", "--release", "-p", "victory"]   # README.md:88
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
exe = "target/release/victory.exe"   # play-rdna.ps1:98 (-Build release default)
diag_build = ["cargo", "build", "--locked", "--profile", "diag", "-p", "victory", "--features", "diagnostics"]
run = ["run", "--console", "series-x", "--execute", "{game_exe}"]   # play-rdna.ps1:181
prewarm = ["shaders", "{game}/shaders.rpf", "{game_exe}", "{game}/XboxBvhBuilder.dll", "{game}/amd_fidelityfx_upscaler_xbox.dll"]
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

preset_safe = ["VICTORY_THIN=", "VICTORY_THIN_THREADS=", "VICTORY_JOIN_PARTS=", "VICTORY_UPLOAD_AHEAD=", "VICTORY_PORT_CONSTANTS=", "VICTORY_PORT_DESCRIPTORS=", "VICTORY_PORT_CBV=", "VICTORY_PORT_GUARD=", "VICTORY_PORT_JOURNAL=", "VICTORY_PORT_BUFFERS=", "VICTORY_INPLACE=", "VICTORY_ASK_SPREAD=", "VICTORY_RESIDENCY=", "VICTORY_SYNC_FINE=", "VICTORY_UNDER_WIDE=0", "VICTORY_LAND_ECHO=0", "VICTORY_PORT_CONSTANTS_ORDER="]   # play-rdna.ps1 -Safe
preset_series_s = ["--console=series-s"]   # play-rdna.ps1 -Console series-s
preset_ray_tracing = ["VICTORY_BVH_BUILDER=1"]   # play-rdna.ps1 -RayTracing
preset_60fps = ["VICTORY_FRAME_INTERVAL_MS=16.667"]   # play-rdna.ps1 -Fps 60
preset_dred = ["NEONBRIDGE_DIAG=1", "VICTORY_D3D12_DRED=1"]
preset_8gb = ["--console=series-s", "VICTORY_CARD_BUFFERS_MB=1024", "VICTORY_TEXTURE_BUDGET_MB=5120"]   # ours
preset_fsr_4k = ["VICTORY_FSR_4K=quality"]   # play.ps1 -Fsr4K quality: PC FidelityFX 4.1.2 at 3840x2160
preset_1080p = ["VICTORY_OUTPUT=1920x1080"]   # play-rdna.ps1:187-198 -Output
preset_1440p = ["VICTORY_OUTPUT=2560x1440"]   # play-rdna.ps1:187-198 -Output

[env]   # rdna-preset.json base + fast
VICTORY_DATA_DIR = "%LOCALAPPDATA%\\6ixpack\\save"
VICTORY_TEXTURE_NO_WAIT = "1"
VICTORY_RELAY = "2"
VICTORY_PORT_CONSTANTS_ORDER = "0"   # rdna-preset.json fast (8ba4f34)
VICTORY_WIDE_BACK = "1"
VICTORY_CARD_REHASH_RUNS = "1"
VICTORY_JOIN_COPIES = "1"
VICTORY_INDIRECT_WINDOW = "1"
VICTORY_RELAY_COPY = "1"
VICTORY_CARD_STEPS = "2"
VICTORY_INDIRECT_BATCH = "2"
VICTORY_MAP_THREADS = "1"
VICTORY_TITLE_PRIORITIES = "0"
VICTORY_CARD_AWAKE = "1"
VICTORY_SHOW_AFTER = "1"
VICTORY_AMBIENT = "0.8"
VICTORY_D3D12_DRED = "light"
VICTORY_CARD_BUFFERS_MIN_MB = "1"
VICTORY_THIN = "1"
VICTORY_THIN_THREADS = "14"
VICTORY_JOIN_PARTS = "8"
VICTORY_UPLOAD_AHEAD = "1"
VICTORY_PORT_CONSTANTS = "1"
VICTORY_PORT_DESCRIPTORS = "1"
VICTORY_PORT_CBV = "1"
VICTORY_PORT_GUARD = "1"
VICTORY_PORT_JOURNAL = "1"
VICTORY_PORT_BUFFERS = "1"
VICTORY_INPLACE = "2"
VICTORY_ASK_SPREAD = "1"
VICTORY_RESIDENCY = "1"
VICTORY_SYNC_FINE = "1"

[controls]
left_stick = "W A S D"
right_stick = "I J K L"
a = "Enter"
b = "Backspace"
x = "X"
y = "Y"
lb = "Q"
rb = "E"
lt = "Z"
rt = "C"
ls = "F"
rs = "H"
dpad = "Arrows"
view = "Tab"
menu = "Esc"
