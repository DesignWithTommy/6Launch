name = "polskagurom"
fork = "VIctory"
about = "POLSKAGUROM 45422b4 (GPL-3.0): 19.4 fps average on an RTX 5060 Ti 16 GB (Series S, DLSS via OptiScaler, Guard + Journal); not yet run here"
upstream = "https://github.com/polackangry/POLSKAGUROM"
updated = "2026-11-26 21:31"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 12   # GitHub stars when last checked
build = ["cargo", "build", "--release", "--locked", "-p", "victory"]   # README.md:23; Play-VIctory.cmd:20
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
exe = "target/release/victory.exe"   # Play-VIctory.cmd:18
diag_build = ["cargo", "build", "--profile", "diag", "-p", "victory", "--features", "diagnostics", "--locked"]   # Cargo.toml:79 [profile.diag]
diag_exe = "target/diag/victory.exe"
cwd = "target/release"
run = ["run", "{game_exe}", "--console", "series-s", "--execute"]   # Play-VIctory.cmd:47
game_env = "VICTORY_GAME_DIR"   # Play-VIctory.cmd:12-13
cache_env = "VICTORY_CACHE_DIR"   # Play-VIctory.cmd:24 (Neonbridge: this runtime's own cache dir)
prewarm = []   # no warm/shaders step in its README or Play-VIctory.cmd
agility = false   # not checked in the tree
preset_raytracing = ["VICTORY_BVH_BUILDER=1", "VICTORY_DXR_HW=1", "VICTORY_DXR_VRAM_MB=512"]   # Play-VIctory.cmd raytracing (:7-11)
preset_no_guard = ["VICTORY_PORT_GUARD=", "VICTORY_PORT_JOURNAL=", "VICTORY_LIMIT_IDLE_LIST_TRIM="]   # Play-VIctory.cmd alone, without the README example's three switches
preset_dred = ["NEONBRIDGE_DIAG=1", "VICTORY_D3D12_DRED=1"]
# VICTORY_FSR_DLL is pointed at <game>\amd_fidelityfx_upscaler_dx12.dll when that file exists (Play-VIctory.cmd:45); not set here.

[env]   # Play-VIctory.cmd:23-46 plus README.md:28-30 (its run example)
VICTORY_DATA_DIR = "%LOCALAPPDATA%\\6ixpack\\save"   # i95: one save/settings folder for the victory family
VICTORY_AMBIENT_AIR = "1.5"
VICTORY_TEXTURE_NO_WAIT = "1"
VICTORY_RELAY = "2"
VICTORY_WIDE_BACK = "1"
VICTORY_CARD_REHASH_RUNS = "1"
VICTORY_JOIN_COPIES = "1"
VICTORY_INDIRECT_WINDOW = "1"
VICTORY_RELAY_COPY = "1"
VICTORY_CARD_STEPS = "2"
VICTORY_INDIRECT_BATCH = "2"
VICTORY_MAP_THREADS = "1"
VICTORY_CARD_AWAKE = "1"
VICTORY_SHOW_AFTER = "1"
VICTORY_AMBIENT = "0.8"
VICTORY_THIN = "1"
VICTORY_JOIN_PARTS = "8"
VICTORY_UPLOAD_AHEAD = "1"
VICTORY_LEVELS_ON_DEMAND = "1"
VICTORY_CARD_BUFFERS_MIN_KB = "64"
VICTORY_WIDE_THREADS = "8"
VICTORY_LOG = "warn"
VICTORY_PORT_GUARD = "1"   # README.md:28
VICTORY_PORT_JOURNAL = "1"   # README.md:29
VICTORY_LIMIT_IDLE_LIST_TRIM = "1"   # README.md:30
