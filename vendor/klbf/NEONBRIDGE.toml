# Neonbridge launcher spec for vendor/klbf: PastiiJay's KLBF Lab, a victory/victory-fork
# build vendored clean. Build, pre-build and run settings are its README.md "Run"
# (README.md:116-160). Its claim: new game to free roam, 77 minutes without a crash,
# 5-9 fps on an AMD RX 9070 XT. Not yet confirmed on NVIDIA by its author.
name = "klbf"
fork = "victory-fork"
gpu = "AMD"   # the card it is tuned for (README "Tuned for"; the picker's filter)
rank = 7   # i95 rank: score 67.5 by PortWatch VI's formula (from the author's report; scripts/rank.py)
about = "KLBF Lab 87e5f7b (GPL-3.0): 14.0 fps average over 37 minutes of play, player in control through the prologue (77 min on an earlier build), RX 9070 XT; not yet run here"
upstream = "https://github.com/PastiiJay/klbf-lab"
updated = "2026-11-28 05:29"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 260   # GitHub stars when last checked
build = ["cargo", "build", "--release", "--locked"]   # README.md:127
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
exe = "target/release/victory.exe"
diag_build = []   # its README names no diagnostics build
# README.md:153: without --console series-s it renders native (~5 fps) and needs no
# FidelityFX SDK; the series-s + FSR setting is the "fsr" preset (needs VICTORY_FFX_DIR).
run = ["run", "{game_exe}", "--execute"]
prewarm = ["translate", "{game}/shaders.rpf", "--cache", "--pipelines", "--jobs", "{jobs}"]   # README.md:155
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

options = [
  "VICTORY_FFX_DIR=<FidelityFX SDK>\\Kits\\FidelityFX\\signedbin: AMD FSR DLLs, README.md:119",
  "VICTORY_LATE_WAIT=0: if the device is lost after the world loads, README.md:158",
  "VICTORY_PAGE_LIST=enqueue|submit|late, README.md:98",
]
preset_fsr = ["--console=series-s", "VICTORY_FFX_DIR=%LOCALAPPDATA%\\6ixpack\\ffx"]   # README.md:150, :119; AMD FidelityFX SDK v2.4.0 signedbin DLLs (loader, upscaler, framegeneration)

preset_series_s = ["--console=series-s"]   # Series S profile (less GPU memory)

preset_8gb = ["VICTORY_RELAY=0", "VICTORY_CARD_BUFFERS_MB=1024", "VICTORY_TEXTURE_BUDGET_MB=5120", "VICTORY_TEXTURE_NO_WAIT=1", "VICTORY_WIDE_REFRESH=1", "VICTORY_WIDE_MERGE=1", "VICTORY_JOIN_COPIES=1", "VICTORY_DISPLAY_MODE=1920x1080"]   # VItoriaBr's 8 GB setting (its README.md:290-305), the switches this tree reads
preset_16gb_ram = ["--console=series-s", "VICTORY_KEEP_SNAPSHOTS_MB=64", "VICTORY_TEXTURE_STAGE_MB=128"]   # ours: Series S with fewer worker threads and smaller snapshot/staging pools, for 16 GB PCs (only the switches this tree reads); untested
preset_4060 = ["--console=series-s", "VICTORY_KEEP_SNAPSHOTS_MB=64", "VICTORY_TEXTURE_STAGE_MB=128", "VICTORY_CARD_BUFFERS_MB=1024", "VICTORY_CARD_WINDOWS_MB=512", "VICTORY_TEXTURE_BUDGET_MB=4096", "VICTORY_DISPLAY_MODE=1920x1080"]   # ours: 8 GB card + 16 GB RAM, Vice-Tay's 4060 profile (~16 fps here) cut to the switches this tree reads; untested on this runtime

[env]
VICTORY_SHADER_OPT = "0"   # README.md:141-148, its play settings
VICTORY_SKIP_PIPELINES = "39f0e9aeb156a61c"   # docs/klbf/skip-amd.txt
VICTORY_LATE_WAIT = "1"
VICTORY_WIDE_BACK = "1"
VICTORY_PIPELINE_WAIT_MS = "24"
VICTORY_RELAY_COPY_QUEUE = "0"

[controls]
left_stick = "W A S D"
right_stick = "I J K L"
a = "Enter"
b = "Backspace"
x = "X"
y = "Y"
lb = "Q"
rb = "E"
lt = "Z"
rt = "C"
ls = "F"
rs = "H"
dpad = "Arrows"
view = "Tab"
menu = "Esc"
