# Launcher spec for vendor/pilotebox: PiloteCode's PiloteBox, a VIctory-based layer tuned for NVIDIA cards.
# Build and run are its README "Quick start" (75321b2): `pilotebox play` sets its own measured settings.
name = "pilotebox"
fork = "VIctory"
gpu = "NVIDIA"   # the card it is tuned for (README "Tuned for"; the picker's filter)
rank = 25   # i95 rank: score 60.1 by PortWatch VI's formula (from the author's report; scripts/rank.py)
about = "PiloteBox 75321b2 (GPL-3.0): 20.5 to 21.5 fps (46.6 to 48.8 ms a frame) in the prologue's first playable scene on 0.13.1, Series X, RTX 5090 (53.7 ms on 0.13.0); Series S at 60.6 ms a frame on 0.13.0; not yet run here"
upstream = "https://github.com/PiloteCode/PiloteBox"
updated = "2026-11-27 08:40"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 3   # GitHub stars when last checked
build = ["cargo", "build", "--release", "-p", "victory"]   # README.md:75
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
exe = "target/release/pilotebox.exe"   # README.md:75
run = ["play", "--game", "{game}"]   # README.md:77 (Series X by default)
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

preset_series_s = ["--mode", "s"]   # README "Modes": 960x540 upscaled, much lighter on the card
preset_ray_tracing = ["--rt"]   # README: the ray-tracing structure builder (dark rooms need it)
preset_safe = ["--safe"]   # README: the newest speed-ups left out

[env]
VICTORY_DATA_DIR = "%LOCALAPPDATA%\\6ixpack\\save"   # Neonbridge: one save/settings folder for the victory family
