# i95 launcher spec for KomanderDG88/VIniVIdiVIci: author build and run from its README.
name = "vinividivici"
fork = "VIctory"
rank = 14   # i95 rank: score 63.1 by PortWatch VI's formula (from the author's report; scripts/rank.py)
about = "VIniVIdiVIci 06ddcb8 (GPL-3.0): 6.0 fps median in the first room on its defaults, 38 minutes in the world, RTX 4060 Ti; not yet run here"
upstream = "https://github.com/KomanderDG88/VIniVIdiVIci"
updated = "2026-11-27 09:55"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 7   # GitHub stars when last checked
build = ["cargo", "build", "--release", "-p", "victory", "--locked"]   # README.md:79
exe = "target/release/victory.exe"
run = ["run", "{game_exe}", "--execute"]   # README.md:85
prewarm = ["translate", "{game}", "--warm", "all", "--jobs", "{jobs}"]
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

preset_held_levels = ["VICTORY_HELD_LEVELS=1"]   # README.md: VI-BR-PORT's held levels, in main, off by default (no texture slot left waiting on 8 GB, 5.90 fps)
preset_series_s = ["--console=series-s"]   # Series S profile (less GPU memory)
preset_dred = ["NEONBRIDGE_DIAG=1", "VICTORY_D3D12_DRED=1"]   # D3D12 crash breadcrumbs in the log (diagnostics build: host.rs reads it only there)
preset_warp = ["NEONBRIDGE_DIAG=1", "VICTORY_D3D12_WARP=1"]   # software GPU (slow; diagnostics build only, host.rs cfg!(feature = "diagnostics"))

preset_8gb = ["--console=series-s", "VICTORY_SKIP_WC_BACK=1", "VICTORY_COPY_PLAIN=1", "VICTORY_TEXTURE_DROP_MIPS=1", "VICTORY_AMBIENT=0.6", "VICTORY_CARD_ROOM_FOR_TARGETS_MB=1536", "VICTORY_ASYNC_SUBMIT=1", "VICTORY_QUEUE2=1", "VICTORY_JOIN_PARTS=1", "VICTORY_BACK_OWN_VIEW=1", "VICTORY_INDIRECT_GATHER=1", "VICTORY_CARD_REHASH_RUNS=1", "VICTORY_CARD_HASH_LEN=1", "VICTORY_MERGE_GAP=64", "VICTORY_MERGE_RUNS=4096", "VICTORY_STAGING_POOL=0", "VICTORY_TABLED_ALL=1"]   # README.md:192-201, the author's 8 GB set

preset_fast = ["VICTORY_SKIP_WC_BACK=1", "VICTORY_COPY_PLAIN=1", "VICTORY_TEXTURE_DROP_MIPS=1"]   # README Status: 5.95 fps, median 168 ms, first room, RTX 4060 Ti (build bfb2072)

[env]

[controls]
left_stick = "W A S D"
right_stick = "I J K L"
a = "Enter"
b = "Backspace"
x = "X"
y = "Y"
lb = "Q"
rb = "E"
lt = "Z"
rt = "C"
ls = "F"
rs = "H"
dpad = "Arrows"
view = "Tab"
menu = "Esc"
