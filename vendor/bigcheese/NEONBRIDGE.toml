# Neonbridge launcher spec for vendor/bigcheese: computermakemegta6's VIctory-BigCheese.
# Build and env are its Play-VIctory.cmd (release build).

name = "bigcheese"
fork = "VIctory"
gpu = "NVIDIA"   # the card it is tuned for (README; the picker's filter)
rank = 39   # i95 rank: score 58.8 by PortWatch VI's formula (i95's assessment from its author's report; scripts/rank.py)
about = "VIctory-BigCheese 370b9e5 (GPL-3.0): a VIctory fork for 16 GB RAM: 17 fps held in the open world, prologue 13-20 fps (author); not yet run here"
upstream = "https://github.com/computermakemegta6/VIctory-BigCheese"
updated = "2026-11-28 10:52"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 21   # GitHub stars when last checked
build = ["cargo", "build", "--release", "--locked", "-p", "victory"]
exe = "target/release/victory.exe"
run = ["run", "{game_exe}", "--execute", "--console", "series-s"]   # Play-VIctory.cmd
prewarm = ["shaders", "{game}/shaders.rpf", "{game_exe}", "{game}/XboxBvhBuilder.dll", "{game}/amd_fidelityfx_upscaler_xbox.dll", "--jobs", "{jobs}"]
watch = ["apps", "crates", "src", "Cargo.toml", "Cargo.lock", "CMakeLists.txt"]
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

[env]   # Play-VIctory.cmd
VICTORY_AMBIENT_AIR = "1.5"
VICTORY_TEXTURE_NO_WAIT = "1"
VICTORY_RELAY = "2"
VICTORY_WIDE_BACK = "1"
VICTORY_CARD_REHASH_RUNS = "1"
VICTORY_JOIN_COPIES = "1"
VICTORY_INDIRECT_WINDOW = "1"
VICTORY_RELAY_COPY = "1"
VICTORY_CARD_STEPS = "2"
VICTORY_INDIRECT_BATCH = "2"
VICTORY_MAP_THREADS = "1"
VICTORY_CARD_AWAKE = "1"
VICTORY_SHOW_AFTER = "1"
VICTORY_AMBIENT = "0.8"
VICTORY_THIN = "1"
VICTORY_JOIN_PARTS = "8"
VICTORY_UPLOAD_AHEAD = "1"
VICTORY_LEVELS_ON_DEMAND = "1"
VICTORY_CARD_BUFFERS_MIN_KB = "64"
VICTORY_LOG = "warn"
