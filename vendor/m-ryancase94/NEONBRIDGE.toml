# i95 spec for RyanCase94/victory-Rycas: a mix source (Mix page only, not in the runtime list).
name = "m-ryancase94"
fork = "VIctory"
mix_only = true
about = "victory-Rycas 8df9468 (GPL-3.0): ~7.8 fps, even pacing (RTX 4070 Ti)"
upstream = "https://github.com/RyanCase94/victory-Rycas"
build = ["cargo", "build", "--release", "-p", "victory", "--locked"]
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
exe = "target/release/victory.exe"
run = ["run", "{game_exe}", "--execute"]
prewarm = ["translate", "{game}", "--warm", "all", "--jobs", "{jobs}"]
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

[env]

[controls]
left_stick = "W A S D"
right_stick = "I J K L"
a = "Enter"
b = "Backspace"
x = "X"
y = "Y"
lb = "Q"
rb = "E"
lt = "Z"
rt = "C"
ls = "F"
rs = "H"
dpad = "Arrows"
view = "Tab"
menu = "Esc"
