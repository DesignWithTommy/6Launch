# Launcher spec for vendor/kitty6: kitty-core's Kitty6 (VIctory-7900XTX fork tuned for an RTX 4070 12 GB, 32 GB RAM).
# Build, run and env are its README "Build" and scripts/play.ps1 (rewritten upstream: default no switches, the runtime's default console, diag build, run from the repo root).
name = "kitty6"
fork = "VIctory-7900XTX"
gpu = "NVIDIA"   # the card it is tuned for (README "Tuned for"; the picker's filter)
rank = 17   # i95 rank: score 62.5 by PortWatch VI's formula (from the author's report; scripts/rank.py)
about = "Kitty6 84be060 (GPL-3.0): 20.5 fps median in the opening scene (Series S) on an RTX 4070, ~5 min runs; not on the tracker; not yet run here"
upstream = "https://github.com/kitty-core/Kitty6"
updated = "2026-11-26 23:42"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 6   # GitHub stars when last checked
build = ["cargo", "build", "--locked", "--profile", "diag", "-p", "victory", "--features", "diagnostics"]   # README.md:86
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
exe = "target/diag/victory.exe"   # play.ps1:30 (-Build diag default)
diag_build = []
run = ["run", "{game_exe}", "--execute"]   # play.ps1:38 (no --console)
cwd = "."   # play.ps1:37: run from the repository root (victory.toml is looked for there)
prewarm = ["shaders", "{game}/shaders.rpf", "{game_exe}", "{game}/XboxBvhBuilder.dll", "{game}/amd_fidelityfx_upscaler_xbox.dll"]
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

preset_safe = ["VICTORY_THIN=", "VICTORY_JOIN_PARTS=", "VICTORY_UPLOAD_AHEAD=", "VICTORY_UNDER_WIDE=0", "VICTORY_LAND_ECHO=0"]   # play.ps1 -Safe
preset_ray_tracing = ["VICTORY_BVH_BUILDER=1"]   # play.ps1 -RayTracing
preset_series_s = ["--console=series-s"]   # ours (its old -Console S)
preset_8gb = ["--console=series-s", "VICTORY_CARD_BUFFERS_MB=1024", "VICTORY_TEXTURE_BUDGET_MB=5120", "VICTORY_TEXTURE_MIP_BIAS=1"]   # ours
preset_dred = ["VICTORY_D3D12_DRED=1"]
preset_uncapped = ["VICTORY_FRAME_INTERVAL_MS=0"]   # play.ps1:118
preset_quality_low = ["VICTORY_TEXTURE_MIP_BIAS=2"]   # play.ps1:117 -Quality low
preset_quality_medium = ["VICTORY_TEXTURE_MIP_BIAS=1"]   # play.ps1:117 -Quality medium

[env]   # scripts/play.ps1 $settings (no switches)
VICTORY_TEXTURE_NO_WAIT = "1"
VICTORY_RELAY = "2"
VICTORY_WIDE_BACK = "1"
VICTORY_CARD_REHASH_RUNS = "1"
VICTORY_JOIN_COPIES = "1"
VICTORY_INDIRECT_WINDOW = "1"
VICTORY_RELAY_COPY = "1"
VICTORY_CARD_STEPS = "2"
VICTORY_INDIRECT_BATCH = "2"
VICTORY_MAP_THREADS = "1"
VICTORY_TITLE_PRIORITIES = "0"
VICTORY_CARD_AWAKE = "1"
VICTORY_SHOW_AFTER = "1"
VICTORY_AMBIENT = "0.8"
VICTORY_D3D12_DRED = "light"
VICTORY_SKIP_PIPELINES = "none"
VICTORY_THIN = "1"
VICTORY_JOIN_PARTS = "8"
VICTORY_UPLOAD_AHEAD = "1"

[controls]
left_stick = "W A S D"
right_stick = "I J K L"
a = "Enter"
b = "Backspace"
x = "X"
y = "Y"
lb = "Q"
rb = "E"
lt = "Z"
rt = "C"
ls = "F"
rs = "H"
dpad = "Arrows"
view = "Tab"
menu = "Esc"
