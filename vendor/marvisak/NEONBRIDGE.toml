# i95 launcher spec for Marvisak/VIctory: author build and run from its README.
name = "marvisak"
fork = "VIctory"
rank = 14   # #14 on vuyp's GTA VI PC race tracker (vuyp.github.io/gta6-pc-race)
about = "VIctory 63bcca4 (GPL-3.0): The opening mission at about 1 fps on an RX 6700 XT, 'not playable'"
upstream = "https://github.com/Marvisak/VIctory"
updated = "2026-11-25 18:27"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 13667   # GitHub stars when last checked
build = ["cargo", "build", "--release", "-p", "victory", "--locked"]   # README.md:92
exe = "target/release/victory.exe"
run = ["run", "{game_exe}", "--execute"]   # README.md:94
prewarm = ["translate", "--cache", "--pipelines", "{game}/shaders.rpf", "{game_exe}", "{game}/XboxBvhBuilder.dll", "{game}/amd_fidelityfx_upscaler_xbox.dll"]   # README.md:93
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

preset_series_s = ["--console=series-s"]   # Series S profile (less GPU memory)
preset_dred = ["NEONBRIDGE_DIAG=1", "VICTORY_D3D12_DRED=1"]   # D3D12 crash breadcrumbs in the log (diagnostics build: host.rs reads it only there)
preset_warp = ["NEONBRIDGE_DIAG=1", "VICTORY_D3D12_WARP=1"]   # software GPU (slow; diagnostics build only, host.rs cfg!(feature = "diagnostics"))
preset_1080p = ["VICTORY_WINDOW_MAX=1920x1080"]   # README.md:127

[env]

[controls]
left_stick = "W A S D"
right_stick = "I J K L"
a = "Enter"
b = "Backspace"
x = "X"
y = "Y"
lb = "Q"
rb = "E"
lt = "Z"
rt = "C"
ls = "F"
rs = "H"
dpad = "Arrows"
view = "Tab"
menu = "Esc"
