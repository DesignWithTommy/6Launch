# Neonbridge launcher spec for vendor/victory (src/runtimes.rs reads it).
# Settings are play-victory.ps1's (ScarlettPort scripts, credit to its authors);
# its user choices (VICTORY_FAST_BOOT, VICTORY_SAVE_SLOT, VICTORY_AUTO_INPUT)
# stay off unless set in the environment, which passes them on.
name = "victory"
fork = "victory-fork"
rank = 2   # #2 on vuyp's GTA VI PC race tracker (vuyp.github.io/gta6-pc-race)
about = "VIctory-fxceless b1d777a (GPL-3.0): 7.5 to 8.5 fps at the first boat mission, 10 to 14 in light scenes, RTX 4070"
upstream = "https://github.com/fxceless/victory-fork"
# fxceless's victory has no Agility opt-in (no D3D12SDKVersion/D3D12SDKPath
# exports, unlike ScarlettPort's copy): it runs on the system's D3D12.
build = ["cargo", "build", "--release", "-p", "victory", "--locked"]   # README.md:346 (+--locked)
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
exe = "target/release/victory.exe"
# NEONBRIDGE_DIAG (on unless 0): the author's diagnostics build, used in place of build/exe; [] = none.
diag_build = ["cargo", "build", "--profile", "diag", "-p", "victory", "--features", "diagnostics", "--locked"]   # README.md:387 (+--locked)
diag_exe = "target/diag/victory.exe"   # README.md:387
run = ["run", "{game_exe}", "--execute"]   # README.md:347; console defaults to series-x (apps/victory/src/main.rs:108)
# Every shader container in the game, CPU only (about 5 min).
prewarm = ["translate", "{game}", "--warm", "all", "--jobs", "{jobs}"]
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

options = [
  "VICTORY_FAST_CORES=0|1 (default 1): the submit and copy-back threads ask for the fast cores of a hybrid CPU (fxceless d827419), read at crates/victory-gpu/src/framelog.rs:219",
  "VICTORY_DISK_CORES=slow (default off): the DirectStorage workers ask for the slow cores (fxceless d827419), read at crates/victory-hle/src/modules/dstorage.rs:499",
]
# ScarlettPort play-victory.ps1:51-59 settings, not this author's: optional (README.md:44 names RELAY=2 as a newer switch).
preset_scarlettport_settings = ["VICTORY_RELAY=2", "VICTORY_PIPELINE_WAIT_MS=0"]   # the ScarlettPort switches this tree reads
preset_series_s = ["--console=series-s"]
# Below: Neonbridge plumbing only, no change to how the author's build runs.
preset_dred = ["NEONBRIDGE_DIAG=1", "VICTORY_D3D12_DRED=1"]   # D3D12 crash breadcrumbs in the log (diagnostics build: host.rs reads it only there)
preset_warp = ["NEONBRIDGE_DIAG=1", "VICTORY_D3D12_WARP=1"]   # software GPU (slow; diagnostics build only, host.rs cfg!(feature = "diagnostics"))

preset_8gb = ["VICTORY_RELAY=0", "VICTORY_FILL_WAIT=1", "VICTORY_CARD_BUFFERS_MB=1024", "VICTORY_TEXTURE_BUDGET_MB=5120", "VICTORY_PAGE_WRITES=slots", "VICTORY_TEXTURE_NO_WAIT=1", "VICTORY_WIDE_REFRESH=1", "VICTORY_WIDE_MERGE=1", "VICTORY_JOIN_COPIES=1", "VICTORY_DISPLAY_MODE=1920x1080"]   # VItoriaBr's 8 GB setting (its README.md:290-305), the switches this tree reads

[env]
VICTORY_DATA_DIR = "%LOCALAPPDATA%\\6ixpack\\save"   # Neonbridge: one save/settings folder for the victory family (storage/settings identical across trees)

# Keyboard as the gamepad, shown by the controls overlay (F1). From
# crates/victory-hle/src/modules/gameinput.rs FALLBACK_BUTTONS and fallback();
# a real controller plays as well.
[controls]
left_stick = "W A S D"
right_stick = "I J K L"
a = "Enter"
b = "Backspace"
x = "X"
y = "Y"
lb = "Q"
rb = "E"
lt = "Z"
rt = "C"
ls = "F"
rs = "H"
dpad = "Arrows"
view = "Tab"
menu = "Esc"
