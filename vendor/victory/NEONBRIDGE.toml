# Neonbridge launcher spec for vendor/victory (src/runtimes.rs reads it).
# Settings are play-victory.ps1's (ScarlettPort scripts, credit to its authors);
# its user choices (VICTORY_FAST_BOOT, VICTORY_SAVE_SLOT, VICTORY_AUTO_INPUT)
# stay off unless set in the environment, which passes them on.
name = "victory"
fork = "victory-fork"
gpu = "NVIDIA"   # the card it is tuned for (README "Tuned for"; the picker's filter)
rank = 32   # i95 rank: score 59.8 by PortWatch VI's formula (its own assessment; scripts/rank.py)
about = "VIctory-fxceless 6b3ce6c (GPL-3.0): its ray-tracing builder is now its default: 0.2 to 3 fps with ray-traced shadows and light, 5 to 9 min runs ending in a crash in the game's script code, RTX 4070; without it about 11 fps at the first boat mission"
upstream = "https://github.com/fxceless/victory-fork"
updated = "2026-11-27 22:53"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 3366   # GitHub stars when last checked
# fxceless's victory has no Agility opt-in (no D3D12SDKVersion/D3D12SDKPath
# exports, unlike ScarlettPort's copy): it runs on the system's D3D12.
build = ["cargo", "build", "--release", "-p", "victory", "--locked"]   # README.md:346 (+--locked)
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
exe = "target/release/victory.exe"
# NEONBRIDGE_DIAG (on unless 0): the author's diagnostics build, used in place of build/exe; [] = none.
diag_build = ["cargo", "build", "--profile", "diag", "-p", "victory", "--features", "diagnostics", "--locked"]   # README.md:387 (+--locked)
diag_exe = "target/diag/victory.exe"   # README.md:387
run = ["run", "{game_exe}", "--console", "series-s", "--execute"]   # Play-VIctory.cmd (Series S)
# Every shader container in the game, CPU only (about 5 min).
prewarm = ["translate", "{game}", "--warm", "all", "--jobs", "{jobs}"]
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

options = [
  "VICTORY_FAST_CORES=0|1 (default 1): the submit and copy-back threads ask for the fast cores of a hybrid CPU (fxceless d827419), read at crates/victory-gpu/src/framelog.rs:219",
  "VICTORY_DISK_CORES=slow (default off): the DirectStorage workers ask for the slow cores (fxceless d827419), read at crates/victory-hle/src/modules/dstorage.rs:499",
]
# ScarlettPort play-victory.ps1:51-59 settings, not this author's: optional (README.md:44 names RELAY=2 as a newer switch).
preset_scarlettport_settings = ["VICTORY_PIPELINE_WAIT_MS=0"]   # the ScarlettPort switches this tree reads
preset_series_x = ["--console=series-x"]
# Below: Neonbridge plumbing only, no change to how the author's build runs.
preset_plain = ["VICTORY_AMBIENT=", "VICTORY_AMBIENT_AIR=", "VICTORY_CARD_AWAKE=", "VICTORY_CARD_BUFFERS_MIN_KB=", "VICTORY_CARD_REHASH_RUNS=", "VICTORY_CARD_STEPS=", "VICTORY_INDIRECT_BATCH=", "VICTORY_INDIRECT_WINDOW=", "VICTORY_JOIN_COPIES=", "VICTORY_JOIN_PARTS=", "VICTORY_LEVELS_ON_DEMAND=", "VICTORY_LOG=", "VICTORY_MAP_THREADS=", "VICTORY_RELAY=", "VICTORY_RELAY_COPY=", "VICTORY_SHOW_AFTER=", "VICTORY_TEXTURE_NO_WAIT=", "VICTORY_THIN=", "VICTORY_UPLOAD_AHEAD=", "VICTORY_WIDE_BACK="]   # the tree's own defaults (none of Play-VIctory.cmd's switches)
preset_dred = ["NEONBRIDGE_DIAG=1", "VICTORY_D3D12_DRED=1"]   # D3D12 crash breadcrumbs in the log (diagnostics build: host.rs reads it only there)
preset_warp = ["NEONBRIDGE_DIAG=1", "VICTORY_D3D12_WARP=1"]   # software GPU (slow; diagnostics build only, host.rs cfg!(feature = "diagnostics"))

preset_8gb = ["VICTORY_RELAY=0", "VICTORY_FILL_WAIT=1", "VICTORY_CARD_BUFFERS_MB=1024", "VICTORY_TEXTURE_BUDGET_MB=5120", "VICTORY_PAGE_WRITES=slots", "VICTORY_TEXTURE_NO_WAIT=1", "VICTORY_WIDE_REFRESH=1", "VICTORY_WIDE_MERGE=1", "VICTORY_JOIN_COPIES=1", "VICTORY_DISPLAY_MODE=1920x1080"]   # VItoriaBr's 8 GB setting (its README.md:290-305), the switches this tree reads
preset_16gb_ram = ["--console=series-s", "VICTORY_KEEP_SNAPSHOTS_MB=64", "VICTORY_TEXTURE_STAGE_MB=128"]   # ours: Series S with fewer worker threads and smaller snapshot/staging pools, for 16 GB PCs (only the switches this tree reads); untested
preset_4060 = ["--console=series-s", "VICTORY_KEEP_SNAPSHOTS_MB=64", "VICTORY_TEXTURE_STAGE_MB=128", "VICTORY_CARD_BUFFERS_MIN_KB=64", "VICTORY_CARD_BUFFERS_MB=1024", "VICTORY_CARD_WINDOWS_MB=512", "VICTORY_TEXTURE_BUDGET_MB=4096", "VICTORY_DISPLAY_MODE=1920x1080"]   # ours: 8 GB card + 16 GB RAM, Vice-Tay's 4060 profile (~16 fps here) cut to the switches this tree reads; untested on this runtime
preset_low_vram = ["--console=series-s", "VICTORY_LEVELS_ON_DEMAND=1", "VICTORY_TEXTURE_BUDGET_MB=4096"]   # ours: mip levels loaded on demand (PercyScarlett: ~3 GB less video memory) on Series S; untested
preset_no_ray_tracing = ["VICTORY_BVH_BUILDER=0"]   # README.md: ray tracing on by default again (its launcher sets VICTORY_BVH_BUILDER=1); 0 = the light estimate
preset_no_dynamic_wait = ["VICTORY_DYNAMIC_WAIT=0"]   # README.md: dynamic wait on by default now

[env]
# Play-VIctory.cmd (its Windows launcher): the author's defaults
VICTORY_AMBIENT = "0.8"
VICTORY_AMBIENT_AIR = "1.5"
VICTORY_CARD_AWAKE = "1"
VICTORY_CARD_BUFFERS_MIN_KB = "64"
VICTORY_CARD_REHASH_RUNS = "1"
VICTORY_CARD_STEPS = "2"
VICTORY_INDIRECT_BATCH = "2"
VICTORY_INDIRECT_WINDOW = "1"
VICTORY_JOIN_COPIES = "1"
VICTORY_JOIN_PARTS = "8"
VICTORY_LEVELS_ON_DEMAND = "1"
VICTORY_LOG = "warn"
VICTORY_MAP_THREADS = "1"
VICTORY_RELAY = "2"
VICTORY_RELAY_COPY = "1"
VICTORY_SHOW_AFTER = "1"
VICTORY_TEXTURE_NO_WAIT = "1"
VICTORY_THIN = "1"
VICTORY_UPLOAD_AHEAD = "1"
VICTORY_WIDE_BACK = "1"
VICTORY_BVH_BUILDER = "1"   # README.md: its launcher turns ray tracing on

# Keyboard as the gamepad, shown by the controls overlay (F1). From
# crates/victory-hle/src/modules/gameinput.rs FALLBACK_BUTTONS and fallback();
# a real controller plays as well.
[controls]
left_stick = "W A S D"
right_stick = "I J K L"
a = "Enter"
b = "Backspace"
x = "X"
y = "Y"
lb = "Q"
rb = "E"
lt = "Z"
rt = "C"
ls = "F"
rs = "H"
dpad = "Arrows"
view = "Tab"
menu = "Esc"
