VICTORY_FRAME_INTERVAL_US = "1000"   # play-local-test.ps1:36, 107 (-Fps 1000: no cap)
VICTORY_BVH_BUILDER = "0"   # Play-Victory-FrameGen.ps1:23-41
VICTORY_LOG = "info"
