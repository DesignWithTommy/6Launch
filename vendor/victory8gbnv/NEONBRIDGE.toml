# Neonbridge launcher spec for vendor/victory8gbnv: sponex-hub's victory-8gb (8 GB NVIDIA).
# Build and env are its default launcher, launchers/Play-Victory-FrameGen.cmd -> Play-Victory-FrameGen.ps1
# -> scripts/play-local-test.ps1 -Build release -SeriesS -Dlss quality -FrameGen -FrameGenX 4 (README.md:43-50).
# (Not vendor/victory8gb: that is CuteBooty's victory-8gb.)

name = "victory8gbnv"
fork = "VIctory"
gpu = "NVIDIA 8 GB"   # the card it is tuned for (README.md:3: RTX 5060 8 GB; the picker's filter)
rank = 31   # i95 rank: score 60.1 by PortWatch VI's formula (i95's assessment from its author's report; scripts/rank.py)
about = "victory-8gb 73d1874 (GPL-3.0): a VIctory build for 8 GB NVIDIA cards, Series S + DLSS Quality + frame generation on an RTX 5060: 17-25 fps rendered, 70-100 shown (author); not yet run here"
upstream = "https://github.com/sponex-hub/victory-8gb"
updated = "2026-11-28 11:49"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 2   # GitHub stars when last checked
build = ["cargo", "build", "--release", "--locked", "-p", "victory"]   # scripts/play-local-test.ps1:134 (README.md:40 without --locked)
exe = "target/release/victory.exe"   # scripts/play-local-test.ps1:125 (-Build release)
diag_build = ["cargo", "build", "--locked", "--profile", "diag", "-p", "victory", "--features", "diagnostics"]   # scripts/play-local-test.ps1:133
diag_exe = "target/diag/victory.exe"   # Cargo.toml:78 [profile.diag]
cwd = "."   # scripts/play-local-test.ps1:148 (victory.toml is read from the repository root)
run = ["run", "{game_exe}", "--console", "series-s", "--execute"]   # scripts/play-local-test.ps1:115, 149 (-SeriesS: Play-Victory-FrameGen.ps1:59)
prewarm = ["shaders", "{game}/shaders.rpf", "{game_exe}", "{game}/XboxBvhBuilder.dll", "{game}/amd_fidelityfx_upscaler_xbox.dll", "--jobs", "{jobs}"]   # no warm step in its launchers; VICTORY_PIPELINE_BOOK feeds `victory warm` (play-local-test.ps1:84-85)
watch = ["apps", "crates", "xtask", "Cargo.toml", "Cargo.lock"]   # Cargo.toml:3 members
game_env = "VICTORY_GAME_DIR"   # Play-Victory-FrameGen.ps1:14
cache_env = "VICTORY_CACHE_DIR"   # Play-Victory-FrameGen.ps1:15
agility = false   # no D3D12SDKVersion export in the tree

# NVIDIA Streamline SDK v2.14.16 (scripts/get-nvidia-sdks.ps1:7, run by Get-NVIDIA-DLSS.cmd) from NVIDIA-RTX/Streamline releases, its bin\x64 into %LOCALAPPDATA%\6ixpack\streamline (VICTORY_STREAMLINE_DIR below)
setup = [
  "streamline: powershell -NoProfile -Command \"$d=Join-Path $env:LOCALAPPDATA '6ixpack\\streamline'; if (-not (Test-Path (Join-Path $d 'sl.interposer.dll'))) { $t=Join-Path $env:TEMP 'streamline-sdk-v2.14.16.zip'; Invoke-WebRequest -UseBasicParsing https://github.com/NVIDIA-RTX/Streamline/releases/download/v2.14.16/streamline-sdk-v2.14.16.zip -OutFile $t; $x=Join-Path $env:TEMP 'streamline-sdk-v2.14.16'; Expand-Archive -Force $t $x; New-Item -ItemType Directory -Force $d | Out-Null; $b=(Get-ChildItem $x -Recurse -Directory -Filter x64 | Where-Object { $_.Parent.Name -eq 'bin' } | Select-Object -First 1).FullName; Copy-Item (Join-Path $b '*') $d -Recurse -Force; Remove-Item -Recurse -Force $t,$x }\" [asks first: download]",
]

# The author's other launchers and switches
preset_cutscene = ["VICTORY_TEXTURE_ROOM_PERCENT=125", "VICTORY_TEXTURE_NO_WAIT=0", "VICTORY_DLSS=0", "VICTORY_FRAMEGEN=0"]   # launchers/Play-Victory-Cutscene.cmd (Play-Victory-FrameGen.ps1:47-53: -Dlss off -NoFrameGenReady)
preset_framegen_2x = ["VICTORY_FRAMEGEN_X=2"]   # TITLE_FRAMEGEN_X=2 (Play-Victory-FrameGen.ps1:21; cards before RTX 50)
preset_native_kbm = ["VICTORY_ONE_PAD=0", "VICTORY_NO_STANDIN=1"]   # -NativeKbm (Play-Victory-FrameGen.ps1:46; experiment)
preset_series_x = ["--console=series-x", "VICTORY_NATIVE_1440P=1"]   # play-local-test.ps1 without -SeriesS (:20-23, 87-88)
preset_no_water_light = ["VICTORY_WATER_LIGHT=0"]   # Play-Victory-FrameGen.ps1:32-34 ("if dark blocks show in the sea")

