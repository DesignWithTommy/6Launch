# Launcher spec for vendor/sleyfork: Spaghetih's victory-sley-fork.
# Build, run and env are its README and Play-VIctory.cmd (4 GB cards: Play-VIctory-4GB.cmd).
name = "sleyfork"
fork = "VIctory"
about = "victory-sley-fork ba6ce8e (GPL-3.0): 20.6 fps median at about 6,000 draws, 11-15 fps in dense night scenes; not yet run here"
upstream = "https://github.com/Spaghetih/victory-sley-fork"
updated = "2026-11-27 06:35"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 140   # GitHub stars when last checked
build = ["cargo", "build", "--release", "--locked", "-p", "victory"]   # README.md:149, Play-VIctory.cmd:18 (--locked)
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
exe = "target/release/victory.exe"   # Play-VIctory.cmd:16
diag_build = ["cargo", "build", "--profile", "diag", "-p", "victory", "--features", "diagnostics", "--locked"]   # Cargo.toml:95 (+--locked)
diag_exe = "target/diag/victory.exe"   # Cargo.toml:97 [profile.diag]
cwd = "target/release"
run = ["run", "{game_exe}", "--console", "series-x", "--execute"]   # Play-VIctory.cmd:59
game_env = "VICTORY_GAME_DIR"   # Play-VIctory.cmd:7
cache_env = "VICTORY_CACHE_DIR"   # Play-VIctory.cmd:22 (cache-pareto there; i95 gives each runtime its own)
prewarm = ["shaders", "{game}/shaders.rpf"]   # README.md:150
agility = false

preset_4gb = ["--console=series-s", "VICTORY_AMBIENT=0.8", "VICTORY_TEXTURE_GUARD=", "VICTORY_CARD_BUFFERS_MIN_KB=4096", "VICTORY_CARD_BUFFERS_MB=256", "VICTORY_D3D12_BACKGROUND=0"]   # Play-VIctory-4GB.cmd:16,39-42,44
preset_measured = ["VICTORY_AMBIENT=constant:1.2", "VICTORY_TEXTURE_NO_WAIT=0", "VICTORY_CARD_BUFFERS_MB=2048"]   # README.md:155-170, the set its page was measured with (FidelityFX dir left out)
preset_dred = ["NEONBRIDGE_DIAG=1", "VICTORY_D3D12_DRED=1"]

[env]   # Play-VIctory.cmd:21-56
VICTORY_DATA_DIR = "%LOCALAPPDATA%\\6ixpack\\save"   # i95: one save/settings folder for the victory family
VICTORY_AMBIENT_AIR = "1.5"
VICTORY_TEXTURE_NO_WAIT = "1"
VICTORY_RELAY = "2"
VICTORY_WIDE_BACK = "1"
VICTORY_CARD_REHASH_RUNS = "1"
VICTORY_JOIN_COPIES = "1"
VICTORY_INDIRECT_WINDOW = "1"
VICTORY_RELAY_COPY = "1"
VICTORY_CARD_STEPS = "2"
VICTORY_INDIRECT_BATCH = "2"
VICTORY_MAP_THREADS = "1"
VICTORY_CARD_AWAKE = "1"
VICTORY_SHOW_AFTER = "1"
VICTORY_AMBIENT = "constant:0.8"
VICTORY_TEXTURE_GUARD = "0"
VICTORY_THIN = "0"
VICTORY_JOIN_PARTS = "0"
VICTORY_PORT_CONSTANTS = "0"
VICTORY_PORT_CBV = "0"
VICTORY_LIBRARY_STORE_LATER = "1"
VICTORY_PIPELINE_WAIT_MS = "0"
VICTORY_UPLOAD_AHEAD = "1"
VICTORY_LEVELS_ON_DEMAND = "1"
VICTORY_CARD_BUFFERS_MIN_KB = "64"
VICTORY_LOG = "warn"
