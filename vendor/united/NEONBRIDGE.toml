# Neonbridge launcher spec for vendor/united: Fayberr's Victory-United (VIctory's best open PRs in one tree).
# Build and run are its README "How to run it" and scripts/play.ps1 (default: Series X, full screen, settings by card).
name = "united"
fork = "VIctory"
gpu = "Any"   # the card it is tuned for (README "Tuned for"; the picker's filter)
rank = 38   # i95 rank: score 59.0 by PortWatch VI's formula (from the author's report; scripts/rank.py)
about = "Victory-United 7466d89 (GPL-3.0): VIctory's best open pull requests on Vice-Tay's code: 8 to 12 fps in the open world with scripted movement, three 7-minute runs, Series S; 'not playable yet'; not yet run here"
upstream = "https://github.com/Fayberr/Victory-United"
updated = "2026-11-28 08:23"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 11   # GitHub stars when last checked
build = ["cargo", "build", "--locked", "--profile", "diag", "-p", "victory", "--features", "diagnostics"]   # README.md:59
exe = "target/diag/victory.exe"   # play.ps1:80 ($Build = diag)
diag_build = []   # its default build is already the diagnostics one
run = ["run", "{game_exe}", "--console", "series-x", "--execute"]   # play.ps1:86
prewarm = ["shaders", "{game}/shaders.rpf", "{game_exe}", "{game}/XboxBvhBuilder.dll", "{game}/amd_fidelityfx_upscaler_xbox.dll", "--jobs", "{jobs}"]   # README.md:65 (then warm --used)
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

preset_series_s = ["--console=series-s"]   # play.ps1 -Console series-s (play.ps1:86)
preset_7900xtx = ["VICTORY_THIN_THREADS=", "VICTORY_UNDER_THREADS=", "VICTORY_LAND_THREADS=", "VICTORY_PLACED_ORDER=", "VICTORY_WAVE_WIDE_ONLY=", "VICTORY_MAP_THREADS=1", "VICTORY_CARD_AWAKE=1"]   # play.ps1 -Machine 7900xtx (play.ps1:32-35; auto picks it on a non-NVIDIA card)
preset_4070 = ["VICTORY_THIN_THREADS=8", "VICTORY_UNDER_THREADS=6", "VICTORY_LAND_THREADS=4", "VICTORY_MAP_THREADS=1", "VICTORY_PIPELINE_WORKERS=3", "VICTORY_CARD_RESERVE_BUDGETS=1", "VICTORY_CARD_BUFFERS_MB=1536", "VICTORY_CARD_WINDOWS_MB=1024"]   # play.ps1 -Machine 4070
preset_3080ti = ["VICTORY_THIN_THREADS=6", "VICTORY_UNDER_THREADS=4", "VICTORY_LAND_THREADS=3", "VICTORY_CARD_RESERVE_BUDGETS=1", "VICTORY_CARD_BUFFERS_MB=1536", "VICTORY_CARD_WINDOWS_MB=1024", "VICTORY_TEXTURE_ROOM_PERCENT=85"]   # play.ps1 -Machine 3080ti (auto on an RTX 3080 Ti)
preset_safe = ["VICTORY_THIN=", "VICTORY_JOIN_PARTS=", "VICTORY_UPLOAD_AHEAD=", "VICTORY_INDIRECT_BATCH=", "VICTORY_MAP_THREADS=", "VICTORY_PLACED_ORDER=", "VICTORY_UNDER_WIDE=0", "VICTORY_LAND_ECHO=0"]   # play.ps1 -Safe (play.ps1:41-49,58-65)
preset_ray_tracing = ["VICTORY_BVH_BUILDER=1"]   # play.ps1 -RayTracing (play.ps1:66)
preset_windowed = ["VICTORY_FULLSCREEN="]   # play.ps1 -Windowed (play.ps1:68)
preset_8gb = ["VICTORY_RELAY=0", "VICTORY_CARD_BUFFERS_MB=1024", "VICTORY_TEXTURE_BUDGET_MB=5120", "VICTORY_PAGE_WRITES=slots", "VICTORY_AMBIENT=0.6", "VICTORY_TEXTURE_NO_WAIT=1", "VICTORY_WIDE_REFRESH=1", "VICTORY_WIDE_MERGE=1", "VICTORY_JOIN_COPIES=1", "VICTORY_DISPLAY_MODE=1920x1080"]   # VItoriaBr's 8 GB setting (its README.md:290-305), the switches this tree reads (VICTORY_FILL_WAIT is not)

[env]   # play.ps1 default path
VICTORY_PRESS_FILE = "{press}"   # read at crates/victory-core/src/config.rs:4
VICTORY_TEXTURE_NO_WAIT = "1"   # play.ps1:21-26 defaults
VICTORY_RELAY = "2"
VICTORY_WIDE_BACK = "1"
VICTORY_CARD_REHASH_RUNS = "1"
VICTORY_JOIN_COPIES = "1"
VICTORY_INDIRECT_WINDOW = "1"
VICTORY_RELAY_COPY = "1"
VICTORY_CARD_STEPS = "2"
VICTORY_TITLE_PRIORITIES = "0"
VICTORY_SHOW_AFTER = "1"
VICTORY_CARD_AWAKE = "0"
VICTORY_AMBIENT = "constant:0.1"
VICTORY_AMBIENT_AIR = "0.8"
VICTORY_CARD_BUFFERS_MIN_KB = "64"
VICTORY_PORT_CONSTANTS = "1"
VICTORY_D3D12_DRED = "light"
VICTORY_THIN_THREADS = "12"   # play.ps1:36-57: -Machine auto on an NVIDIA card (4090 settings)
VICTORY_UNDER_THREADS = "8"
VICTORY_LAND_THREADS = "6"
VICTORY_MAP_THREADS = "auto"
VICTORY_PLACED_ORDER = "1"
VICTORY_WAVE_WIDE_ONLY = "6f225b641c5b0708,5dc3b25986622949,369cbe906ea72764,2cc4c197ee29e291"
VICTORY_THIN = "1"   # play.ps1:60-65 (not -Safe)
VICTORY_JOIN_PARTS = "8"
VICTORY_UPLOAD_AHEAD = "1"
VICTORY_INDIRECT_BATCH = "2"
VICTORY_FULLSCREEN = "1"   # play.ps1:68 (not -Windowed)

[controls]
left_stick = "W A S D"
right_stick = "I J K L"
a = "Enter"
b = "Backspace"
x = "X"
y = "Y"
lb = "Q"
rb = "E"
lt = "Z"
rt = "C"
ls = "F"
rs = "H"
dpad = "Arrows"
view = "Tab"
menu = "Esc"
