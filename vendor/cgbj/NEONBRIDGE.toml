# Neonbridge launcher spec for vendor/cgbj: DoubleGhosty's cool_fox, a continuation of CGBJ (codec-d/cool_fox, no longer on GitHub).
# Build, run and env are its README and Play-VIctory.cmd (VICTORY_LOG=warn left out: the loader reads the info-level fps line).
name = "cgbj"
fork = "VIctory"
rank = 0   # top of our list (tracker has CGBJ at #9: unconfirmed 25 fps, videos of driving)
about = "CGBJ (cool_fox c3e5c37, GPL-3.0): 25 fps average relayed by PortWatch on an NVIDIA card, unconfirmed; not yet run here"
upstream = "https://github.com/DoubleGhosty/cool_fox"
build = ["cargo", "build", "--release", "--locked", "-p", "victory"]   # README.md:34
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
exe = "target/release/victory.exe"   # Play-VIctory.cmd runner fallback
diag_build = ["cargo", "build", "--locked", "--profile", "diag", "-p", "victory", "--features", "diagnostics"]   # README.md:62
run = ["run", "{game_exe}", "--console", "series-x", "--execute"]   # Play-VIctory.cmd
prewarm = ["shaders", "{game}/shaders.rpf", "{game_exe}", "{game}/XboxBvhBuilder.dll", "{game}/amd_fidelityfx_upscaler_xbox.dll"]   # the 7900XTX family's warm
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

preset_4gb = ["--console=series-s", "VICTORY_AMBIENT=0.8", "VICTORY_CARD_BUFFERS_MB=256", "VICTORY_CARD_BUFFERS_MIN_KB=4096", "VICTORY_D3D12_BACKGROUND=0", "VICTORY_JOIN_PARTS=8", "VICTORY_TEXTURE_GUARD=", "VICTORY_THIN=1"]   # Play-VIctory-4GB.cmd
preset_60fps = ["VICTORY_FRAME_INTERVAL_MS=16.667"]   # README.md:20 frame rate unlock
preset_1080p = ["VICTORY_OUTPUT=1920x1080"]   # README.md:19
preset_cbv = ["VICTORY_PORT_CBV=1"]   # README.md:21 zero-copy constant buffers

[env]   # Play-VIctory.cmd
VICTORY_DATA_DIR = "%LOCALAPPDATA%\\6ixpack\\save"   # Neonbridge: one save/settings folder for the victory family
VICTORY_AMBIENT_AIR = "1.5"
VICTORY_TEXTURE_NO_WAIT = "1"
VICTORY_RELAY = "2"
VICTORY_WIDE_BACK = "1"
VICTORY_CARD_REHASH_RUNS = "1"
VICTORY_JOIN_COPIES = "1"
VICTORY_INDIRECT_WINDOW = "1"
VICTORY_RELAY_COPY = "1"
VICTORY_CARD_STEPS = "2"
VICTORY_INDIRECT_BATCH = "2"
VICTORY_MAP_THREADS = "1"
VICTORY_CARD_AWAKE = "1"
VICTORY_SHOW_AFTER = "1"
VICTORY_AMBIENT = "constant:0.8"
VICTORY_TEXTURE_GUARD = "0"
VICTORY_THIN = "0"
VICTORY_JOIN_PARTS = "0"
VICTORY_UPLOAD_AHEAD = "1"
VICTORY_LEVELS_ON_DEMAND = "1"
VICTORY_CARD_BUFFERS_MIN_KB = "64"
