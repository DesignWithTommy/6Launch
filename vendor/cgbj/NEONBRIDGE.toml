# Neonbridge launcher spec for vendor/cgbj: DoubleGhosty's cool_fox, a continuation of CGBJ (codec-d/cool_fox, no longer on GitHub).
# Build, run and env are its README and Play-VIctory.cmd (VICTORY_LOG=warn left out: the loader reads the info-level fps line).
name = "cgbj"
fork = "VIctory"
rank = 12   # #12 on vuyp's GTA VI PC race tracker (vuyp.github.io/gta6-pc-race)
about = "CGBJ 42b95b9 (cool_fox, GPL-3.0): 25 fps average in gameplay on an NVIDIA card, relayed by PortWatch and unconfirmed; an outside build reports a 22.4 fps median on the boat, also unverified; zero-copy buffers now on by default; the original repo is no longer on GitHub; not yet run here"
upstream = "https://github.com/DoubleGhosty/cool_fox"
updated = "2026-11-27 06:03"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 818   # GitHub stars when last checked
build = ["cargo", "build", "--release", "--locked", "-p", "victory"]   # README.md:34
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
exe = "target/release/victory.exe"   # Play-VIctory.cmd runner fallback
diag_build = ["cargo", "build", "--locked", "--profile", "diag", "-p", "victory", "--features", "diagnostics"]   # README.md:62
run = ["run", "{game_exe}", "--console", "series-x", "--execute"]   # Play-VIctory.cmd
prewarm = ["shaders", "{game}/shaders.rpf", "{game_exe}", "{game}/XboxBvhBuilder.dll", "{game}/amd_fidelityfx_upscaler_xbox.dll"]   # the 7900XTX family's warm
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

preset_4gb = ["--console=series-s", "VICTORY_UPLOAD_AHEAD=1", "VICTORY_AMBIENT=0.8", "VICTORY_CARD_BUFFERS_MB=256", "VICTORY_CARD_BUFFERS_MIN_KB=4096", "VICTORY_D3D12_BACKGROUND=0", "VICTORY_TEXTURE_GUARD="]   # Play-VIctory-4GB.cmd
preset_60fps = ["VICTORY_FRAME_INTERVAL_MS=16.667"]   # README.md:29 frame rate unlock
preset_1080p = ["VICTORY_OUTPUT=1920x1080"]   # README.md:28
preset_port = ["VICTORY_PORT_CONSTANTS=1", "VICTORY_PORT_CBV=1"]   # renderer ports 1 and 5 (opt-in since 8f34ba7)
preset_amd = ["VICTORY_THIN=1", "VICTORY_JOIN_PARTS=8", "VICTORY_PORT_CONSTANTS=1", "VICTORY_PORT_CBV=1"]   # Play-VIctory-AMD.cmd:38-46, README.md:97
preset_120fps = ["VICTORY_FRAME_INTERVAL_MS=8.333"]   # README.md:29

[env]   # Play-VIctory.cmd
VICTORY_DATA_DIR = "%LOCALAPPDATA%\\6ixpack\\save"   # Neonbridge: one save/settings folder for the victory family
VICTORY_AMBIENT_AIR = "1.5"
VICTORY_TEXTURE_NO_WAIT = "1"
VICTORY_RELAY = "2"
VICTORY_WIDE_BACK = "1"
VICTORY_CARD_REHASH_RUNS = "1"
VICTORY_JOIN_COPIES = "1"
VICTORY_INDIRECT_WINDOW = "1"
VICTORY_RELAY_COPY = "1"
VICTORY_CARD_STEPS = "2"
VICTORY_INDIRECT_BATCH = "2"
VICTORY_MAP_THREADS = "1"
VICTORY_CARD_AWAKE = "1"
VICTORY_SHOW_AFTER = "1"
VICTORY_AMBIENT = "constant:0.8"
VICTORY_TEXTURE_GUARD = "0"
VICTORY_THIN = "0"
VICTORY_JOIN_PARTS = "0"
VICTORY_UPLOAD_AHEAD = "1"
VICTORY_LEVELS_ON_DEMAND = "1"
VICTORY_CARD_BUFFERS_MIN_KB = "64"
VICTORY_PORT_CONSTANTS = "0"   # Play-VIctory.cmd (8f34ba7): opt-in again
VICTORY_PORT_CBV = "0"
VICTORY_PORT_GUARD = "1"   # Play-VIctory.cmd (583108b): ports 6 and 7 on, 2-5 ms a frame saved
VICTORY_PORT_JOURNAL = "1"
VICTORY_LIBRARY_STORE_LATER = "1"   # Play-VIctory.cmd (8f34ba7)
VICTORY_PIPELINE_WAIT_MS = "0"

[controls]
left_stick = "W A S D"
right_stick = "I J K L"
a = "Enter"
b = "Backspace"
x = "X"
y = "Y"
lb = "Q"
rb = "E"
lt = "Z"
rt = "C"
ls = "F"
rs = "H"
dpad = "Arrows"
view = "Tab"
menu = "Esc"
