name = "amdr13"
fork = "victory-amd r13"
rank = 45   # i95 rank: score 54.5 by PortWatch VI's formula (from the author's report; scripts/rank.py)
about = "victory-amd r13 bc646fa (GPL-3.0): victory-fork merged for AMD cards, about 3-5 fps in the open world on an RX 9060 XT 16 GB (its README); not yet run here"
upstream = "https://github.com/tinygusie2/victory-amd"
updated = "2026-11-26 11:50"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 1   # GitHub stars when last checked
# Settings: scripts/start.ps1 (measured on an RX 9060 XT), as [env].
build = ["cargo", "build", "--release", "-p", "victory", "--locked"]   # README.md (+--locked)
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
exe = "target/release/victory.exe"
diag_build = ["cargo", "build", "--profile", "diag", "-p", "victory", "--features", "diagnostics", "--locked"]   # README.md
diag_exe = "target/diag/victory.exe"
run = ["run", "{game_exe}", "--execute"]   # README.md (Series X, its default and the profile it measures)
prewarm = []   # no warm step in its scripts
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false
preset_series_s = ["--console=series-s"]
preset_dred = ["NEONBRIDGE_DIAG=1", "VICTORY_D3D12_DRED=1"]   # crash breadcrumbs (diagnostics build)
preset_plain = ["VICTORY_SHADER_LOOP_LIMIT=", "VICTORY_MAX_COMPUTE_KB=", "VICTORY_LATE_WAIT=", "VICTORY_WIDE_BACK=", "VICTORY_CARD_BUFFERS_MIN_MB=", "VICTORY_CARD_BUFFERS_MB=", "VICTORY_TEXTURE_BACK=", "VICTORY_INDIRECT_GATHER=", "VICTORY_JOIN_PARTS=", "VICTORY_INDIRECT_WINDOW=", "VICTORY_LEVELS_ON_DEMAND=", "VICTORY_COPY_PLAIN=", "VICTORY_REMAP_LEAN=", "VICTORY_CARD_REHASH_RUNS=", "VICTORY_SKIP_PIPELINES=", "VICTORY_DISPLAY_MODE=", "VICTORY_HEAP_WORKER=", "VICTORY_PARALLEL_REFRESH=", "VICTORY_SETTLE_ROOM=", "VICTORY_LOOKUP_CACHE="]   # the tree's own defaults, none of start.ps1's

