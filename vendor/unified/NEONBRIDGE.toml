# Neonbridge launcher spec for vendor/unified: Itsbatt's victory-unified, fxceless victory-fork
# 0b0074e plus Belobug (ambient, quad reads, hoisted clamps), DexNom/VIctory (shader, cubemap,
# PSO, range-lock streaming) and its own descriptor-lifetime fix. Build and run are its README.md
# "Quick Play"; the environment is its scripts/play.ps1 (tuned on an RTX 3070 8 GB).
name = "unified"
fork = "Belobug"
rank = 19   # i95 rank: score 62.0 by PortWatch VI's formula (from the author's report; scripts/rank.py)
about = "victory-unified 92dc878 (GPL-3.0): 'A unified fork' tuned for an RTX 3070 8 GB: 2 to 3 fps, about 58 minutes without a crash; not yet run here"
upstream = "https://github.com/Itsbatt/victory-unified"
updated = "2026-11-26 17:44"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 21   # GitHub stars when last checked
build = ["cargo", "build", "--locked", "--profile", "diag", "-p", "victory", "--features", "diagnostics"]   # README.md (e20f64c): the launcher defaults to the diag build
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
exe = "target/diag/victory.exe"   # scripts/play.ps1:12 (-Build diag default)
diag_build = []   # its README names no diagnostics build
run = ["run", "{game_exe}", "--execute"]   # scripts/play.ps1:47 (Series X profile)
prewarm = ["translate", "{game}", "--warm", "all", "--jobs", "{jobs}"]   # its base victory-fork's warm (apps/victory/src/translate.rs:160)
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

options = [
  "VICTORY_ASYNC_PRESENT=1 crashed in nvwgf2umx.dll on its author's RTX 3070 (kept off)",
]

preset_series_s = ["--console=series-s"]   # Series S profile (less GPU memory)
preset_safe = ["VICTORY_THIN=", "VICTORY_JOIN_PARTS=", "VICTORY_UPLOAD_AHEAD=", "VICTORY_UNDER_WIDE=0", "VICTORY_LAND_ECHO=0"]   # play.ps1:33-37 -Safe
preset_ray_tracing = ["VICTORY_BVH_BUILDER=1"]   # play.ps1:38 -RayTracing
preset_rtx3070 = ["VICTORY_D3D12_ADAPTER=NVIDIA", "VICTORY_RESIDENCY=1", "VICTORY_CARD_WINDOWS_MB=0", "VICTORY_CARD_BUFFERS_MIN_MB=1", "VICTORY_CARD_BUFFERS_MB=768", "VICTORY_CARD_ROOM_FOR_TARGETS_MB=1536", "VICTORY_TEXTURE_ROOM_PERCENT=82", "VICTORY_KEEP_SNAPSHOTS=1", "VICTORY_LEVELS_ON_DEMAND=1", "VICTORY_TILES_SMALL_WHEN_FULL_MB=512", "VICTORY_TEXTURE_NO_WAIT=0", "VICTORY_INDIRECT_WINDOW=0", "VICTORY_QUEUE2=1", "VICTORY_PIPELINE_WAIT_MS=100", "VICTORY_AMBIENT_FALLBACK=1", "VICTORY_AMBIENT_AIR=0.1", "VICTORY_AMBIENT_SETTLE=250,3", "VICTORY_PIPELINE_BOOK=1", "VICTORY_ASYNC_SUBMIT=1", "VICTORY_UNDER_THREADS=4", "VICTORY_VIEW_THREADS=4", "VICTORY_PORT_GUARD=1", "VICTORY_PORT_JOURNAL=1", "VICTORY_LOOKUP_CACHE=1", "VICTORY_TABLE_STAGES=1", "VICTORY_WAVE64_PAIRED=1", "VICTORY_SUBMIT_DEPTH=64", "VICTORY_SUBMIT_FRAMES=2", "VICTORY_LATE_WAIT_LISTS=16", "VICTORY_OUTPUT=1920x1080", "VICTORY_D3D12_DRED="]   # Play-GTA6-RTX3070.ps1:39-115
preset_rtx3070_native1080p = ["VICTORY_D3D12_ADAPTER=NVIDIA", "VICTORY_RESIDENCY=1", "VICTORY_CARD_WINDOWS_MB=0", "VICTORY_CARD_BUFFERS_MIN_MB=1", "VICTORY_CARD_BUFFERS_MB=768", "VICTORY_CARD_ROOM_FOR_TARGETS_MB=1536", "VICTORY_TEXTURE_ROOM_PERCENT=82", "VICTORY_KEEP_SNAPSHOTS=1", "VICTORY_LEVELS_ON_DEMAND=1", "VICTORY_TILES_SMALL_WHEN_FULL_MB=512", "VICTORY_TEXTURE_NO_WAIT=0", "VICTORY_INDIRECT_WINDOW=0", "VICTORY_QUEUE2=1", "VICTORY_PIPELINE_WAIT_MS=100", "VICTORY_AMBIENT_FALLBACK=1", "VICTORY_AMBIENT_AIR=0.1", "VICTORY_AMBIENT_SETTLE=250,3", "VICTORY_PIPELINE_BOOK=1", "VICTORY_ASYNC_SUBMIT=1", "VICTORY_UNDER_THREADS=4", "VICTORY_VIEW_THREADS=4", "VICTORY_PORT_GUARD=1", "VICTORY_PORT_JOURNAL=1", "VICTORY_LOOKUP_CACHE=1", "VICTORY_TABLE_STAGES=1", "VICTORY_WAVE64_PAIRED=1", "VICTORY_SUBMIT_DEPTH=64", "VICTORY_SUBMIT_FRAMES=2", "VICTORY_LATE_WAIT_LISTS=16", "VICTORY_OUTPUT=1920x1080", "VICTORY_D3D12_DRED=", "VICTORY_RENDER_SCALE=1.0"]   # Play-GTA6-RTX3070-Native1080p.ps1:12

[env]   # scripts/play.ps1:28-36 (README.md:209: its default launch)
VICTORY_DATA_DIR = "%LOCALAPPDATA%\\6ixpack\\save"   # Neonbridge: one save/settings folder for the victory family
VICTORY_TEXTURE_NO_WAIT = "1"
VICTORY_RELAY = "2"
VICTORY_WIDE_BACK = "1"
VICTORY_CARD_REHASH_RUNS = "1"
VICTORY_JOIN_COPIES = "1"
VICTORY_INDIRECT_WINDOW = "1"
VICTORY_RELAY_COPY = "1"
VICTORY_CARD_STEPS = "2"
VICTORY_INDIRECT_BATCH = "2"
VICTORY_MAP_THREADS = "1"
VICTORY_TITLE_PRIORITIES = "0"
VICTORY_CARD_AWAKE = "1"
VICTORY_SHOW_AFTER = "1"
VICTORY_AMBIENT = "0.8"
VICTORY_D3D12_DRED = "light"
VICTORY_THIN = "1"
VICTORY_JOIN_PARTS = "8"
VICTORY_UPLOAD_AHEAD = "1"

[controls]   # crates/victory-hle/src/modules/gameinput.rs (Space is also A)
left_stick = "W A S D"
right_stick = "I J K L"
a = "Enter / Space"
b = "Backspace"
x = "X"
y = "Y"
lb = "Q"
rb = "E"
lt = "Z"
rt = "C"
ls = "F"
rs = "H"
dpad = "Arrows"
view = "Tab"
menu = "Esc"
