# i95 spec for soldsawn/victory-nvidia-8gb: a mix source (Mix page only, not in the runtime list).
name = "m-soldsawn"
fork = "VIctory"
mix_only = true
about = "victory-nvidia-8gb c09a44e (GPL-3.0): 8-10 fps at 1080p (RTX 4060 Laptop 8 GB)"
upstream = "https://github.com/soldsawn/victory-nvidia-8gb"
build = ["cargo", "build", "--release", "-p", "victory", "--locked"]
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
exe = "target/release/victory.exe"
run = ["run", "{game_exe}", "--execute"]
prewarm = ["translate", "{game}", "--warm", "all", "--jobs", "{jobs}"]
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

[env]

[controls]
left_stick = "W A S D"
right_stick = "I J K L"
a = "Enter"
b = "Backspace"
x = "X"
y = "Y"
lb = "Q"
rb = "E"
lt = "Z"
rt = "C"
ls = "F"
rs = "H"
dpad = "Arrows"
view = "Tab"
menu = "Esc"
