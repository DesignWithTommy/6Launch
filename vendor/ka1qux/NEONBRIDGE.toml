# i95 launcher spec for ka1qux/BRVIctory-ka1qux: author build and run from its README.
name = "ka1qux"
fork = "VIctory"
rank = 19   # #19 on vuyp's GTA VI PC race tracker (vuyp.github.io/gta6-pc-race)
about = "BRVIctory-ka1qux d70ff7b (GPL-3.0): victory-fork tuned on an AMD Radeon"
upstream = "https://github.com/ka1qux/BRVIctory-ka1qux"
build = ["cargo", "build", "--profile", "diag", "-p", "victory", "--features", "diagnostics", "--locked"]   # README.md:297
exe = "target/diag/victory.exe"
run = ["run", "{game_exe}", "--execute"]   # README.md:322
prewarm = ["translate", "--cache", "--pipelines", "--used-pipelines", "{game}/shaders.rpf", "{game_exe}", "{game}/XboxBvhBuilder.dll", "{game}/amd_fidelityfx_upscaler_xbox.dll"]   # README.md:307
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

preset_series_s = ["--console=series-s"]   # Series S profile (less GPU memory)
preset_dred = ["NEONBRIDGE_DIAG=1", "VICTORY_D3D12_DRED=1"]   # D3D12 crash breadcrumbs in the log (diagnostics build: host.rs reads it only there)
preset_warp = ["NEONBRIDGE_DIAG=1", "VICTORY_D3D12_WARP=1"]   # software GPU (slow; diagnostics build only, host.rs cfg!(feature = "diagnostics"))

[env]
VICTORY_INDIRECT_CLAMP = "0"   # README.md:310-315, the switches its state was measured with
VICTORY_SKIP_MOVIES = "1"
VICTORY_COMMIT_RESERVE_MB = "6144"
VICTORY_COPY_PLAIN = "1"
VICTORY_JOIN_PARTS = "1"
VICTORY_BACK_OWN_VIEW = "1"

[controls]
left_stick = "W A S D"
right_stick = "I J K L"
a = "Enter"
b = "Backspace"
x = "X"
y = "Y"
lb = "Q"
rb = "E"
lt = "Z"
rt = "C"
ls = "F"
rs = "H"
dpad = "Arrows"
view = "Tab"
menu = "Esc"
