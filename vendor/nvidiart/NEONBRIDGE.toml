# Neonbridge launcher spec for vendor/nvidiart: Kemerd's VIctory-NVIDIA-RT (a faster fork of VIctory-NVIDIA).
# Build and env are its scripts/play-foxhound.ps1 (PLAY.cmd): release build, Series X at 1440p; DLSS only with NVIDIA's files, so off here.
name = "nvidiart"
fork = "VIctory"
gpu = "NVIDIA"   # the card it is tuned for (README "Tuned for"; the picker's filter)
rank = 29   # i95 rank: score 60.4 by PortWatch VI's formula (i95's assessment from its author's report; scripts/rank.py)
about = "VIctory-NVIDIA-RT 2f0bc2d (GPL-3.0): Kemerd's faster fork of VIctory-NVIDIA (ultrawide, Reflex, HDR10, DLSS, frame generation): 21.9 fps median, 31.9 best in the open world, RTX 5090 at 1440p with DLSS Quality and no frame generation; here without DLSS"
upstream = "https://github.com/Kemerd/VIctory-NVIDIA-RT"
updated = "2026-11-27 19:07"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 278   # GitHub stars when last checked
build = ["cargo", "build", "--release", "--locked", "-p", "victory"]   # play-foxhound.ps1:133 (-Build release, its default)
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
exe = "target/release/victory.exe"
diag_build = []
run = ["run", "{game_exe}", "--console", "series-x", "--execute"]   # play-foxhound.ps1:113,149 (Series X unless -SeriesS)
prewarm = ["preload", "{game}"]   # apps/victory/src/main.rs Preload: shaders, then warm, then the loading pipelines (its F1 PRELOAD SHADERS)
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = true   # apps/victory/src/main.rs: D3D12SDKVersion 614, D3D12\D3D12Core.dll beside victory.exe (needed on Windows 10)
preset_series_s = ["--console=series-s", "VICTORY_NATIVE_1440P="]   # play-foxhound.ps1 -SeriesS
preset_8gb = ["--console=series-s", "VICTORY_NATIVE_1440P=", "VICTORY_TEXTURE_BUDGET_MB=5120"]   # ours: Series S for 8 GB cards
preset_30fps = ["VICTORY_FRAME_INTERVAL_US=33333"]   # play-foxhound.ps1 -Fps 30: the title's own rate
preset_4k = ["VICTORY_NATIVE_1440P="]   # play-foxhound.ps1 -Res 4k: the stock Series X output
preset_1080to1440 = ["VICTORY_NATIVE_1440P=", "VICTORY_RENDER_1080P=1"]   # play-foxhound.ps1:23,89
preset_60fps = ["VICTORY_FRAME_INTERVAL_US=16667"]   # README.md:259, play-foxhound.ps1:107
preset_fast = ["VICTORY_PIPELINE_BOOK=1", "VICTORY_PIPELINE_WAIT_ONCE=1", "VICTORY_PIPELINE_WAIT_BACKLOG=64", "VICTORY_PIPELINE_SLOW_WORKERS=8", "VICTORY_TEXTURE_LOOK_ONCE=1", "VICTORY_TEXTURE_READ_AHEAD=1", "VICTORY_STAGING_NO_ZERO=1", "VICTORY_SEND_COPIED_FIND=1", "VICTORY_FILES_BUFFERED=1", "VICTORY_MEMORY_FRESH=1", "VICTORY_MEMORY_ARENAS_AHEAD=1", "VICTORY_MEMORY_QUIET=1", "VICTORY_MEMORY_LAND_SENT=1", "VICTORY_MEMORY_ASK_RUNS=1", "VICTORY_MEMORY_LEAN=1", "VICTORY_MEMORY_DIRTY=1", "VICTORY_MEMORY_BUFFER_FAULTS=1", "VICTORY_REFRESH_PROBE_US=300", "VICTORY_DECLARE_ACROSS_LISTS=1", "VICTORY_REFRESH_PROBE_TEXTURES=1", "VICTORY_REFRESH_SPLIT=1", "VICTORY_WAIT_SPLIT=1", "VICTORY_PIPELINE_PIECES=1", "VICTORY_PIPELINE_PIECES_REFUSE_UNTRANSLATED=1", "VICTORY_PIPELINE_PIECES_ONLY=graphics", "VICTORY_REFRESH_SET=1", "VICTORY_TITLE_WRITE_RANGE=1", "VICTORY_UNDER_PARTS=1", "VICTORY_SEND_THREAD=1"]   # play-foxhound.ps1 -Fast

[env]   # scripts/play-foxhound.ps1 (its PLAY.cmd): the same settings as VIctory-NVIDIA
VICTORY_THIN = "1"
VICTORY_JOIN_PARTS = "8"
VICTORY_RELAY = "2"
VICTORY_RELAY_COPY = "1"
VICTORY_WIDE_BACK = "1"
VICTORY_CARD_REHASH_RUNS = "1"
VICTORY_JOIN_COPIES = "1"
VICTORY_CARD_STEPS = "2"
VICTORY_CARD_AWAKE = "1"
VICTORY_CARD_BUFFERS_MIN_KB = "64"
VICTORY_INDIRECT_WINDOW = "1"
VICTORY_INDIRECT_BATCH = "2"
VICTORY_UPLOAD_AHEAD = "1"
VICTORY_SHOW_AFTER = "1"
VICTORY_MAP_THREADS = "1"
VICTORY_WC_NO_BACK = "1"
VICTORY_WC_NO_BACK_MIN_KB = "1024"
VICTORY_SOFT_VIEWS = "copies"
VICTORY_TEXTURE_POOL = "1"
VICTORY_RIPE_BLOCKS = "0"
VICTORY_TEXTURE_NO_WAIT = "1"
VICTORY_TEXTURE_CATCHUP = "0"
VICTORY_TEXTURE_STAGE_MS = "16"
VICTORY_LEVELS_ON_DEMAND = "0"
VICTORY_PRELUDE_UPLOADS = "1"
VICTORY_SHOW_NEW_LATER = "1"
VICTORY_POOL_SMALL = "0"
VICTORY_TABLED_REREAD = "1"
VICTORY_QUEUE_HOST_TEXTURES = "0"
VICTORY_HEAP_SYNC_FIRST = "1"
VICTORY_SYNC_IN_PLACE = "1"
VICTORY_SPANS_QUICK = "1"
VICTORY_SYNC_FINE = "1"
VICTORY_HEAP_SYNC_AT_SUBMIT = "1"
VICTORY_AMBIENT = "0.8"
VICTORY_AMBIENT_AIR = "1.5"
VICTORY_AMBIENT_SPECULAR = "1"
VICTORY_EARLY_DEPTH = "1"
VICTORY_LEAVE_OUT = "02384a60fda6f2d0,731a39171b568298"
VICTORY_PIPELINE_BOOK = "1"
VICTORY_NATIVE_1440P = "1"   # -Res 1440, its default
VICTORY_FRAME_INTERVAL_US = "1000"   # -Fps 1000, its default: no cap

[controls]
left_stick = "W A S D"
right_stick = "I J K L"
a = "Enter"
b = "Backspace"
x = "X"
y = "Y"
lb = "Q"
rb = "E"
lt = "Z"
rt = "C"
ls = "F"
rs = "H"
dpad = "Arrows"
view = "Tab"
menu = "Esc"
