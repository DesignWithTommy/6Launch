# Neonbridge launcher spec for vendor/anyxboxx: LooperSalty's AnyXboxX. Its game runtime is the VIctory
# copy in third_party/victory (now built on Vice-Tay, README.md 5a08a33). The author's default is `anyxboxx run --game-dir <game>` (README.md:43), a Rust
# wrapper (crates/anyxboxx/src/run) that builds victory, sets its TUNED env and spawns victory.exe. Replicated
# here, not wrapped: the wrapper builds victory itself and can't take i95's warm placeholders.
name = "anyxboxx"
fork = "Neptune"
rank = 3   # #3 on vuyp's GTA VI PC race tracker (vuyp.github.io/gta6-pc-race)
about = "AnyXboxX b62053f (GPL-3.0): 'About 24 fps median in the world in Full HD', 30 (the game's cap) in lighter scenes, Series X, RTX 4070 SUPER; not yet run here"
upstream = "https://github.com/LooperSalty/AnyXboxX"
updated = "2026-11-27"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 441   # GitHub stars when last checked
build = ["cargo", "build", "--release", "-p", "victory", "--manifest-path", "third_party/victory/Cargo.toml"]   # crates/anyxboxx/src/run/steps.rs:71-73
watch = ["third_party/victory/apps", "third_party/victory/crates", "third_party/victory/Cargo.toml", "third_party/victory/Cargo.lock"]
exe = "third_party/victory/target/release/victory.exe"   # steps.rs:41-44
diag_build = ["cargo", "build", "--profile", "diag", "-p", "victory", "--features", "diagnostics", "--manifest-path", "third_party/victory/Cargo.toml"]   # steps.rs:67-69 (--diag; exe target/diag/victory.exe)
diag_exe = "third_party/victory/target/diag/victory.exe"   # steps.rs:39-42: the diag profile's exe (without this i95 looked for the release exe after a diag build)
run = ["run", "{game_exe}", "--execute"]   # steps.rs:107-113 (console defaults to series-x, apps/victory/src/main.rs:155)
prewarm = ["warm"]   # steps.rs (2225a8e): on the Vice-Tay base warm takes no archives (it refuses them); it makes the pipelines earlier runs noted
game_env = "VICTORY_GAME_DIR"   # settings.rs:84,116
cache_env = "VICTORY_CACHE_DIR"
agility = false

options = [
  "VICTORY_KEYS=4:Enter,8:Enter,...: scripted keys; anyxboxx --auto-a taps Enter (A) every 4 s for 150 s (settings.rs:87-103)",
  "VICTORY_D3D12_DRED=1: device-removed data, diagnostics build (settings.rs:86, --dred)",
  "VICTORY_PANEL=1: F3 panel, diagnostics build (docs/running-gta6.md:26)",
]
preset_quality = ["VICTORY_CARD_WINDOWS_MB=0", "VICTORY_CARD_BUFFERS_MB=1024", "VICTORY_TEXTURE_STAGE_MB=192"]   # settings.rs:78-82 (--quality): picture first
preset_linux_amd = ["VICTORY_FETCH_CHECK=1", "VICTORY_PIPELINE_WAIT_MS=0", "VICTORY_PORT_CONSTANTS=1", "VKD3D_CONFIG=descriptor_heap"]   # settings.rs:36-47 (--profile linux-amd, Proton only)
preset_defaults = ["VICTORY_TEXTURE_NO_WAIT=", "VICTORY_RELAY=", "VICTORY_WIDE_BACK=", "VICTORY_CARD_REHASH_RUNS=", "VICTORY_JOIN_COPIES=", "VICTORY_INDIRECT_WINDOW=", "VICTORY_RELAY_COPY=", "VICTORY_CARD_STEPS=", "VICTORY_TITLE_PRIORITIES=", "VICTORY_SHOW_AFTER=", "VICTORY_AMBIENT=", "VICTORY_D3D12_DRED=", "VICTORY_WAVE_WIDE_ONLY=", "VICTORY_THIN_THREADS=", "VICTORY_UNDER_THREADS=", "VICTORY_LAND_THREADS=", "VICTORY_MAP_THREADS=", "VICTORY_PIPELINE_WORKERS=", "VICTORY_CARD_RESERVE_BUDGETS=", "VICTORY_CARD_BUFFERS_MIN_KB=", "VICTORY_CARD_BUFFERS_MB=", "VICTORY_CARD_WINDOWS_MB=", "VICTORY_THIN=", "VICTORY_JOIN_PARTS=", "VICTORY_UPLOAD_AHEAD=", "VICTORY_INDIRECT_BATCH="]   # settings.rs (--no-tuned-settings): VIctory's own defaults
preset_4k = ["VICTORY_OUTPUT="]   # the title's own size (4K as a Series X wrote it): about 20 fps on its RTX 4070 SUPER
preset_16_cores = ["VICTORY_THIN_THREADS=12", "VICTORY_UNDER_THREADS=8", "VICTORY_LAND_THREADS=6"]   # settings.rs BIG_POOLS (2225a8e): applied by its wrapper on 16+ logical CPUs; 19.6 -> 23.8 fps on its i7-13700KF
preset_24_cores = ["VICTORY_THIN_THREADS=12", "VICTORY_UNDER_THREADS=8", "VICTORY_LAND_THREADS=8"]   # settings.rs HUGE_POOLS (b62053f): its wrapper on 24+ logical CPUs; heavy scenes 17.1 -> 22.0 fps
preset_series_s = ["--console=series-s"]   # apps/victory/src/main.rs:155,179: Series S profile (less GPU memory)
preset_8gb = ["VICTORY_RELAY=0", "VICTORY_CARD_BUFFERS_MB=1024", "VICTORY_TEXTURE_BUDGET_MB=5120", "VICTORY_PAGE_WRITES=slots", "VICTORY_AMBIENT=0.6", "VICTORY_TEXTURE_NO_WAIT=1", "VICTORY_WIDE_REFRESH=1", "VICTORY_WIDE_MERGE=1", "VICTORY_JOIN_COPIES=1", "VICTORY_DISPLAY_MODE=1920x1080"]   # VItoriaBr's 8 GB setting (its README.md:290-305); every var still read by this tree
preset_16gb_ram = ["--console=series-s", "VICTORY_THIN_THREADS=6", "VICTORY_UNDER_THREADS=4", "VICTORY_LAND_THREADS=3", "VICTORY_MAP_THREADS=1", "VICTORY_PIPELINE_WORKERS=2", "VICTORY_SNAPSHOT_POOL=256", "VICTORY_KEEP_SNAPSHOTS_MB=64", "VICTORY_DSTORAGE_STAGING_MB=128", "VICTORY_TEXTURE_STAGE_MB=128"]   # ours: Series S with fewer worker threads and smaller snapshot/staging pools, for 16 GB PCs (only the switches this tree reads); untested
preset_4060 = ["--console=series-s", "VICTORY_THIN_THREADS=6", "VICTORY_UNDER_THREADS=4", "VICTORY_LAND_THREADS=3", "VICTORY_MAP_THREADS=1", "VICTORY_PIPELINE_WORKERS=2", "VICTORY_SNAPSHOT_POOL=256", "VICTORY_KEEP_SNAPSHOTS_MB=64", "VICTORY_DSTORAGE_STAGING_MB=128", "VICTORY_TEXTURE_STAGE_MB=128", "VICTORY_CARD_RESERVE_BUDGETS=1", "VICTORY_CARD_BUFFERS_MIN_KB=64", "VICTORY_CARD_BUFFERS_MB=1024", "VICTORY_CARD_WINDOWS_MB=512", "VICTORY_TEXTURE_BUDGET_MB=4096", "VICTORY_OUTPUT=1920x1080"]   # ours: 8 GB card + 16 GB RAM, Vice-Tay's 4060 profile (~16 fps here) cut to the switches this tree reads; untested on this runtime
preset_low_vram = ["--console=series-s", "VICTORY_LEVELS_ON_DEMAND=1", "VICTORY_TEXTURE_BUDGET_MB=4096"]   # ours: mip levels loaded on demand (PercyScarlett: ~3 GB less video memory) on Series S; untested
preset_warm_all = ["VICTORY_EARLY_ALL=1", "VICTORY_PIPELINE_BOOK=1"]   # ours: every pipeline built when the title creates it and recorded for later runs; first run slower, later runs stutter less; untested
preset_windowed = ["VICTORY_FULLSCREEN="]   # windowed instead of fullscreen

[env]   # crates/anyxboxx/src/run/settings.rs TUNED + ALWAYS (5a08a33: Vice-Tay base, its play.ps1 -Machine 4070)
VICTORY_DATA_DIR = "%LOCALAPPDATA%\6ixpack\save"   # Neonbridge: one save/settings folder for the victory family
VICTORY_TEXTURE_NO_WAIT = "1"
VICTORY_RELAY = "2"
VICTORY_WIDE_BACK = "1"
VICTORY_CARD_REHASH_RUNS = "1"
VICTORY_JOIN_COPIES = "1"
VICTORY_INDIRECT_WINDOW = "1"
VICTORY_RELAY_COPY = "1"
VICTORY_CARD_STEPS = "2"
VICTORY_TITLE_PRIORITIES = "0"
VICTORY_SHOW_AFTER = "1"
VICTORY_AMBIENT = "0.8"
VICTORY_D3D12_DRED = "light"
VICTORY_WAVE_WIDE_ONLY = "6f225b641c5b0708,5dc3b25986622949,369cbe906ea72764,2cc4c197ee29e291"
VICTORY_THIN_THREADS = "8"
VICTORY_UNDER_THREADS = "6"
VICTORY_LAND_THREADS = "4"
VICTORY_MAP_THREADS = "1"
VICTORY_PIPELINE_WORKERS = "3"
VICTORY_CARD_RESERVE_BUDGETS = "1"
VICTORY_CARD_BUFFERS_MIN_KB = "64"
VICTORY_CARD_BUFFERS_MB = "1536"
VICTORY_CARD_WINDOWS_MB = "1024"
VICTORY_THIN = "1"
VICTORY_JOIN_PARTS = "8"
VICTORY_UPLOAD_AHEAD = "1"
VICTORY_INDIRECT_BATCH = "2"
VICTORY_DISCORD = "0"
VICTORY_OUTPUT = "1920x1080"   # anyxboxx-launcher options.rs (4340aac): Full HD by default, 1280x720 inside

[controls]   # third_party/victory/crates/victory-hle/src/modules/gameinput.rs:64-80,133-138 (mouse and Shift/Ctrl gone)
left_stick = "W A S D"
right_stick = "I J K L"
a = "Enter"
b = "Backspace"
x = "X"
y = "Y"
lb = "Q"
rb = "E"
lt = "Z"
rt = "C"
ls = "F"
rs = "H"
dpad = "Arrows"
view = "Tab"
menu = "Esc"
