# i95 launcher spec for voidopcode/vilocity: author build and run from its README.
name = "vilocity"
fork = "Vilocity"
rank = 18   # #18 on vuyp's GTA VI PC race tracker (vuyp.github.io/gta6-pc-race)
about = "Vilocity 0f44a17 (GPL-3.0): 26-27 fps at 5,000 draws, 17-19 at 10,000-11,000, Series S, RTX 5080 (now on cool_fox's engine); not yet run here"
upstream = "https://github.com/voidopcode/vilocity"
updated = "2026-11-26 23:51"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 6   # GitHub stars when last checked
build = ["cargo", "build", "--release", "-p", "vilocity", "--locked"]   # README.md:149
exe = "target/release/vilocity.exe"
run = ["play", "{game}"]   # README.md:158, scripts/play-gta6.ps1
prewarm = ["native", "shaders", "{game}/shaders.rpf"]   # play-gta6.ps1:75 (9ef6bc6)
watch = ["apps", "crates", "native", "compat", "Cargo.toml", "Cargo.lock"]
game_env = "VILOCITY_GAME_DIR"
cache_env = "VILOCITY_CACHE_DIR"
agility = false

preset_series_x = ["VILOCITY_CONSOLE=series-x"]   # play-gta6.ps1 -SeriesX
preset_defaults = ["VILOCITY_AMBIENT=", "VILOCITY_AMBIENT_AIR=", "VILOCITY_TEXTURE_NO_WAIT=", "VILOCITY_RELAY=", "VILOCITY_RELAY_COPY=", "VILOCITY_WIDE_BACK=", "VILOCITY_CARD_REHASH_RUNS=", "VILOCITY_CARD_STEPS=", "VILOCITY_CARD_AWAKE=", "VILOCITY_CARD_BUFFERS_MIN_KB=", "VILOCITY_JOIN_COPIES=", "VILOCITY_JOIN_PARTS=", "VILOCITY_INDIRECT_WINDOW=", "VILOCITY_INDIRECT_BATCH=", "VILOCITY_MAP_THREADS=", "VILOCITY_THIN=", "VILOCITY_UPLOAD_AHEAD=", "VILOCITY_SHOW_AFTER=", "VILOCITY_FRAME_INTERVAL_MS="]   # play-gta6.ps1 -Defaults
preset_amd = ["VILOCITY_CARD_AWAKE=1"]   # play-gta6.ps1: the keep-busy loop on AMD cards
preset_16_cores = ["VILOCITY_THIN_THREADS=12", "VILOCITY_UNDER_THREADS=8", "VILOCITY_LAND_THREADS=6"]   # play-gta6.ps1:51-53 (32+ logical processors)

[env]   # scripts/play-gta6.ps1 (9ef6bc6): the native engine is now cool_fox (30e54b4), its own launcher's set
VILOCITY_CONSOLE = "series-s"   # play-gta6.ps1:24 (default without -SeriesX)
VILOCITY_AMBIENT = "0.8"
VILOCITY_AMBIENT_AIR = "1.5"
VILOCITY_TEXTURE_NO_WAIT = "1"
VILOCITY_RELAY = "2"
VILOCITY_RELAY_COPY = "1"
VILOCITY_WIDE_BACK = "1"
VILOCITY_CARD_REHASH_RUNS = "1"
VILOCITY_CARD_STEPS = "2"
VILOCITY_AMBIENT_FLOOR = "0.05"   # launcher.ps1 (0f44a17) Night, on by default: a little light where no lamp reaches
VILOCITY_CARD_AWAKE = "0"   # play-gta6.ps1 (8f6b185): 0 on NVIDIA cards (its keep-busy loop is for AMD); preset amd turns it back on
VILOCITY_CARD_BUFFERS_MIN_KB = "64"
VILOCITY_JOIN_COPIES = "1"
VILOCITY_JOIN_PARTS = "8"
VILOCITY_INDIRECT_WINDOW = "1"
VILOCITY_INDIRECT_BATCH = "2"
VILOCITY_MAP_THREADS = "1"
VILOCITY_THIN = "1"
VILOCITY_UPLOAD_AHEAD = "1"
VILOCITY_SHOW_AFTER = "1"
VILOCITY_FRAME_INTERVAL_MS = "0"

[controls]
left_stick = "W A S D"
right_stick = "I J K L"
a = "Enter"
b = "Backspace"
x = "X"
y = "Y"
lb = "Q"
rb = "E"
lt = "Z"
rt = "C"
ls = "F"
rs = "H"
dpad = "Arrows"
view = "Tab"
menu = "Esc"
