# i95 launcher spec for voidopcode/vilocity: author build and run from its README.
name = "vilocity"
fork = "Vilocity"
rank = 22   # #22 on vuyp's GTA VI PC race tracker (vuyp.github.io/gta6-pc-race)
about = "Vilocity 5468633 (GPL-3.0): its own layer, native engine for GTA VI"
upstream = "https://github.com/voidopcode/vilocity"
build = ["cargo", "build", "--release", "-p", "vilocity", "--locked"]   # README.md:149
exe = "target/release/vilocity.exe"
run = ["play", "{game}"]   # README.md:158, scripts/play-gta6.ps1
prewarm = ["native", "translate", "--cache", "--pipelines", "{game}/shaders.rpf", "{game_exe}", "{game}/XboxBvhBuilder.dll"]   # README.md:173
watch = ["apps", "crates", "native", "compat", "Cargo.toml", "Cargo.lock"]
game_env = "VILOCITY_GAME_DIR"
cache_env = "VILOCITY_CACHE_DIR"
agility = false

preset_series_s = ["VILOCITY_CONSOLE=series-s"]   # apps/vilocity/src/main.rs:133

[env]
VILOCITY_CONSOLE = "series-s"   # scripts/play-gta6.ps1, its measured set
VILOCITY_ASYNC_SUBMIT = "1"
VILOCITY_QUEUE2 = "1"
VILOCITY_INDIRECT_WINDOW = "1"
VILOCITY_TEXTURE_NO_WAIT = "1"
VILOCITY_COPY_PLAIN = "1"
VILOCITY_LEVELS_ON_DEMAND = "1"
VILOCITY_DISPLAY_MODE = "1920x1080"
VILOCITY_WIDE_REFRESH = "1"
VILOCITY_WIDE_MERGE = "1"
VILOCITY_JOIN_COPIES = "1"
VILOCITY_CARD_BUFFERS_MB = "1536"
VILOCITY_LEAVE_OUT = "TraceRays_BVH,RTShadowTrace,RTDistantShadowTrace,RTDistantLODLightShadow,TraceShadowRays,RaytraceShadows,RaytraceVBuffer,IrradianceCache_ShadowTrace,ShadowRaytracing,CollisionRaytraced,PPR_Raytrace,CS_SpatialFilter,CS_BilateralBlur,CS_ScreenProbes_EvaluateRayRequests,CS_SortRayTiles,CS_Primary_RegisterAllocationRequests"
VILOCITY_ZERO_OUT = "CS_CombinedReflections,CS_ScreenProbes_Inject,CS_DefragHeap_ComputeRelocations"
VILOCITY_RENDER_SCALE = "0.5"   # play-gta6.ps1:27-30 (series-s, 5468633)
VILOCITY_OWN_UPSCALER = "1"
VILOCITY_BVH_NO_HIT = "1"   # play-gta6.ps1:102
VILOCITY_HAIR = "1"   # play-gta6.ps1:106

[controls]
left_stick = "W A S D"
right_stick = "I J K L"
a = "Enter"
b = "Backspace"
x = "X"
y = "Y"
lb = "Q"
rb = "E"
lt = "Z"
rt = "C"
ls = "F"
rs = "H"
dpad = "Arrows"
view = "Tab"
menu = "Esc"
