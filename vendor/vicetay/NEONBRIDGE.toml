# Neonbridge launcher spec for vendor/vicetay: TaynanGT's Vice-Tay. Release build and the switches of its
# 30 min 12 s run (README.md:28).
name = "vicetay"
fork = "VIctory"
rank = 7   # #7 on vuyp's GTA VI PC race tracker (vuyp.github.io/gta6-pc-race)
about = "Vice-Tay 79cc404 (GPL-3.0): 30 min in the world without a crash on its author's RTX 4090; not yet run here"
upstream = "https://github.com/TaynanGT/Vice-Tay"
build = ["cargo", "build", "--release", "--locked", "-p", "victory"]   # README.md:101
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
exe = "target/release/victory.exe"   # README.md:101
diag_build = []
run = ["run", "{game_exe}", "--console", "series-x", "--execute"]   # README.md:98
prewarm = ["translate", "--cache", "--pipelines", "{game}/shaders.rpf", "{game_exe}", "{game}/XboxBvhBuilder.dll", "{game}/amd_fidelityfx_upscaler_xbox.dll"]   # README.md:109
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

[env]
VICTORY_WINDOW_MAX = "1920x1080"   # README.md:97   # README.md:28
VICTORY_DATA_DIR = "%LOCALAPPDATA%\\6ixpack\\save"   # Neonbridge: one save/settings folder for the victory family
VICTORY_RELAY = "2"
VICTORY_BACK_ALIAS = "1"
VICTORY_COPY_NO_WAIT = "1"

[controls]
left_stick = "W A S D"
right_stick = "I J K L"
a = "Enter"
b = "Backspace"
x = "X"
y = "Y"
dpad = "Arrows"
view = "Tab"
menu = "Esc"
