# Launcher spec for vendor/scarlettfork: op-lite's Scarlett fork (branch scarlett-fox): codec-d/cool_fox f4b48ad
# plus a local fork's ("Scarlett") work. Build, run and env are its README and scripts/play-scarlett.ps1 (835ca60).
name = "scarlettfork"
fork = "CGBJ"
rank = 32   # #32 on vuyp's GTA VI PC race tracker (vuyp.github.io/gta6-pc-race)
about = "Scarlett fork bc264a4 (GPL-3.0): 16 to 21 fps in hand-played heavy scenes (prison yard, open world), Series X 1440p, ray tracing off, RTX 4080 SUPER; not yet run here"
upstream = "https://github.com/op-lite/victory-scarlett"
updated = "2026-11-26 19:52"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 117   # GitHub stars when last checked
build = ["cargo", "build", "--profile", "diag", "-p", "victory", "--features", "diagnostics", "--locked"]   # README.md "Build once"
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
exe = "target/diag/victory.exe"   # play-scarlett.ps1:58 (-Build diag)
diag_build = []
run = ["run", "{game_exe}", "--execute"]   # play-scarlett.ps1:142 (Series X)
prewarm = ["shaders", "{game}/shaders.rpf"]   # play-scarlett.ps1:127
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

preset_hooks = ["VICTORY_GPU_ONLY=1", "VICTORY_KNOWN_WRITES=1"]   # play-scarlett.ps1 -Hooks: 10-15 ms a frame less, a few stale small textures
preset_ray_tracing = ["VICTORY_BVH_BUILDER=1", "VICTORY_PROBE_RAYS="]   # -RayTracing (re-translates shaders)
preset_no_probe_rays = ["VICTORY_PROBE_RAYS="]   # -NoProbeRays: the base's picture (violet glow on plants)
preset_series_s = ["--console=series-s"]   # ours
preset_8gb = ["--console=series-s", "VICTORY_CARD_BUFFERS_MB=1024", "VICTORY_TEXTURE_BUDGET_MB=4096"]   # ours, untested
preset_dred = ["VICTORY_D3D12_DRED=1"]

[env]   # scripts/play-scarlett.ps1:69-109 (no switches)
VICTORY_DATA_DIR = "%LOCALAPPDATA%\\6ixpack\\save"
VICTORY_JOIN_COPIES = "1"
VICTORY_REFRESH_ONCE = "1"
VICTORY_CARD_REHASH_RUNS = "1"
VICTORY_BACK_OWN_VIEW = "1"
VICTORY_WIDE_MERGE = "1"
VICTORY_MIRROR_FAST = "1"
VICTORY_FRAME_LOG = "1"
VICTORY_CARD_METER = "1"
VICTORY_PIPELINE_WAIT_MS = "500"
VICTORY_ASYNC_SUBMIT = "1"
VICTORY_QUEUE2 = "1"
VICTORY_INDIRECT_WINDOW = "1"
VICTORY_TEXTURE_NO_WAIT = "1"
VICTORY_COPY_PLAIN = "1"
VICTORY_WIDE_TEXTURES = "1"
VICTORY_INDIRECT_GATHER = "1"
VICTORY_LATE_WAIT_LISTS = "1024"
VICTORY_CARD_FILLS_BATCH = "0"
VICTORY_GATHER_DISPATCH = "0"
VICTORY_RELAY = "2"
VICTORY_WIDE_BACK = "1"
VICTORY_RELAY_COPY = "1"
VICTORY_CARD_STEPS = "2"
VICTORY_INDIRECT_BATCH = "2"
VICTORY_MAP_THREADS = "1"
VICTORY_CARD_AWAKE = "0"
VICTORY_SHOW_AFTER = "1"
VICTORY_JOIN_PARTS = "8"
VICTORY_UPLOAD_AHEAD = "1"
VICTORY_CARD_BUFFERS_MIN_KB = "64"
VICTORY_LEVELS_ON_DEMAND = "0"
VICTORY_POOL_DISCARD = "1"
VICTORY_FILL_TITLE = "1"
VICTORY_PARTIAL_DELTA = "1"
VICTORY_BAKE_DELTA = "1"
VICTORY_MAP_LOCK_FINE = "1"
VICTORY_POOL_CAP = "1"
VICTORY_TABLE_MEMO = "1"
VICTORY_LIST_ALIAS_EXACT = "1"
VICTORY_LIST_HOLD = "1"
VICTORY_BAKE_TEXTURES_MS = "10000"
VICTORY_PLANE_NOW = "1"
VICTORY_SOFT_VIEWS = "copies"   # play-scarlett.ps1 (bc264a4): freeze fix
VICTORY_SAMPLERS_MADE = "1"
VICTORY_TABLE_NAMED_ONLY = "1"
VICTORY_QUEUE_MARKS = "1"
VICTORY_PROBE_RAYS = "1"

[controls]   # README.md "Controls"
left_stick = "W A S D"
right_stick = "I J K L"
a = "Enter"
b = "Backspace"
x = "X"
y = "Y"
lb = "Q"
rb = "E"
lt = "Z"
rt = "C"
dpad = "Arrows"
view = "Tab"
menu = "Esc"
