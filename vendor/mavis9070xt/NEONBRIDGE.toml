# Launcher spec for vendor/mavis9070xt: mavis140's mavis-9070xt, a VIctory-7900XTX fork tuned for the RX 9070 XT.
# Build, run and env are scripts/play-9070xt.ps1 (its measured settings) calling scripts/play.ps1 (diag build, not -Safe).
name = "mavis9070xt"
fork = "VIctory-7900XTX"
gpu = "AMD"   # the card it is tuned for (README "Tuned for"; the picker's filter)
rank = 10   # i95 rank: score 64.9 by PortWatch VI's formula (from the author's report; scripts/rank.py)
about = "mavis-9070xt 3904d23 (GPL-3.0): an 18.9 fps median over a 27-minute session, Series X at 1440p, ray tracing off, RX 9070 XT 16 GB with 32 GB RAM; not yet run here"
upstream = "https://github.com/mavis140/mavis-9070xt"
updated = "2026-11-26 14:29"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 4   # GitHub stars when last checked
build = ["cargo", "build", "--locked", "--profile", "diag", "-p", "victory", "--features", "diagnostics"]   # play.ps1 (-Build diag default)
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
exe = "target/diag/victory.exe"
diag_build = []
run = ["run", "{game_exe}", "--execute", "--console", "series-x"]   # play.ps1
prewarm = ["shaders", "{game}/shaders.rpf", "{game_exe}", "{game}/XboxBvhBuilder.dll", "{game}/amd_fidelityfx_upscaler_xbox.dll"]
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

preset_safe = ["VICTORY_UNDER_WIDE=0", "VICTORY_LAND_ECHO=0", "VICTORY_THIN=", "VICTORY_JOIN_PARTS=", "VICTORY_UPLOAD_AHEAD="]   # play.ps1 -Safe
preset_no_ports = ["VICTORY_PORT_DESCRIPTORS=", "VICTORY_PORT_CBV=", "VICTORY_PORT_GUARD=", "VICTORY_PORT_JOURNAL="]   # play-9070xt.ps1 -NoPorts
preset_1080p = ["VICTORY_OUTPUT=1920x1080"]   # play-9070xt.ps1 -Output 1920x1080
preset_ray_tracing = ["VICTORY_BVH_BUILDER=1"]   # play.ps1 -RayTracing
preset_series_s = ["--console=series-s"]

[env]   # play-9070xt.ps1 measured settings over play.ps1 defaults
VICTORY_TEXTURE_NO_WAIT = "1"
VICTORY_RELAY = "2"
VICTORY_WIDE_BACK = "1"
VICTORY_CARD_REHASH_RUNS = "1"
VICTORY_JOIN_COPIES = "1"
VICTORY_INDIRECT_WINDOW = "1"
VICTORY_RELAY_COPY = "1"
VICTORY_CARD_STEPS = "2"
VICTORY_INDIRECT_BATCH = "2"
VICTORY_MAP_THREADS = "1"
VICTORY_TITLE_PRIORITIES = "0"
VICTORY_CARD_AWAKE = "1"
VICTORY_SHOW_AFTER = "1"
VICTORY_AMBIENT = "0.8"
VICTORY_D3D12_DRED = "light"
VICTORY_RESIDENCY = "1"
VICTORY_THIN = "1"
VICTORY_JOIN_PARTS = "8"
VICTORY_UPLOAD_AHEAD = "1"
VICTORY_PORT_ALL = "0"
VICTORY_INPLACE = "0"
VICTORY_WINDOW_KB = "4096"
VICTORY_OUTPUT = "2560x1440"
VICTORY_TEXTURE_MAX = "auto"
VICTORY_TEXTURE_LOOK_MS = "500"
VICTORY_TEXTURE_AWAY_MS = "15000"
VICTORY_AMBIENT_AIR = "1.5"
VICTORY_MOUSE = "1"
VICTORY_PIPELINE_BOOK = "1"
VICTORY_PORT_DESCRIPTORS = "1"
VICTORY_PORT_CBV = "1"
VICTORY_PORT_GUARD = "1"
VICTORY_PORT_JOURNAL = "1"

[controls]
left_stick = "W A S D"
right_stick = "I J K L"
a = "Enter"
b = "Backspace"
x = "X"
y = "Y"
lb = "Q"
rb = "E"
lt = "Z"
rt = "C"
ls = "F"
rs = "H"
dpad = "Arrows"
view = "Tab"
menu = "Esc"
