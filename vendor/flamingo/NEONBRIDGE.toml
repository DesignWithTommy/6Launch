# Neonbridge launcher spec for vendor/flamingo: realblastex's Flamingo, a victory
# fork vendored clean. Build, run and env are its README.md "Building and running"
# (README.md:98-114). Its claim (README.md status table): about 14 fps facing the
# window and 9-12 fps in the room on an RTX 4070; shadowed areas dark.
name = "flamingo"
fork = "victory-fork"
gpu = "NVIDIA"   # the card it is tuned for (README "Tuned for"; the picker's filter)
rank = 26   # i95 rank: score 61.5 by PortWatch VI's formula (from the author's report; scripts/rank.py)
about = "Flamingo 0d0128f (GPL-3.0): 8.6 fps average over a 24-minute session, RTX 4070, unconfirmed; not yet run here"
upstream = "https://github.com/realblastex/flamingo"
updated = "2026-11-27 06:19"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 54   # GitHub stars when last checked
build = ["cargo", "build", "--profile", "diag", "-p", "victory", "--locked"]
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
exe = "target/diag/victory.exe"
# NEONBRIDGE_DIAG (on unless 0): the author's diagnostics build, used in place of build/exe; [] = none.
diag_build = []   # its default build is already its diag profile (README.md:98); its README names no other diagnostics build
run = ["run", "{game_exe}", "--execute", "--console", "series-x"]   # flamingo-log.cmd:53 (Series S gave black screens)
prewarm = ["translate", "{game}", "--warm", "all", "--jobs", "{jobs}"]
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

options = [
  "FLAMINGO_OSD=0|1: frame-rate overlay, README.md:44",
  "FLAMINGO_DUALSENSE=0: DualSense support off, README.md:50",
  "FLAMINGO_DISCORD=0: Discord Rich Presence off, README.md:122",
  "VICTORY_AMBIENT=<level>: constant in place of the indirect-light resolve, README.md:85",
  "VICTORY_AMBIENT_STUB=1, VICTORY_SHADOWMASK_STUB=1: ray-traced lighting stand-ins, README.md:79",
  "VICTORY_WIDE_TEXTURES=1 (victory-fork #768), README.md:74",
]
# "visible": its ray-traced lighting stand-ins (README.md:79, crates/victory-gpu/src/shader_cache.rs:87); the
# shadowed and indirect-lit passes write constants instead of the black left by rays not running.
preset_visible = ["VICTORY_AMBIENT_STUB=1", "VICTORY_SHADOWMASK_STUB=1"]

preset_series_s = ["--console=series-s"]   # Series S profile (less GPU memory)

preset_8gb = ["VICTORY_RELAY=0", "VICTORY_FILL_WAIT=1", "VICTORY_CARD_BUFFERS_MB=1024", "VICTORY_TEXTURE_BUDGET_MB=5120", "VICTORY_PAGE_WRITES=slots", "VICTORY_AMBIENT=0.6", "VICTORY_TEXTURE_NO_WAIT=1", "VICTORY_WIDE_REFRESH=1", "VICTORY_WIDE_MERGE=1", "VICTORY_JOIN_COPIES=1", "VICTORY_DISPLAY_MODE=1920x1080"]   # VItoriaBr's 8 GB setting (its README.md:290-305), the switches this tree reads

[env]
VICTORY_WIDE_TEXTURES = "1"   # flamingo-log.cmd:49-51
VICTORY_VIEW_GUARD = "0"
FLAMINGO_BVH_MISS = "1"
VICTORY_NO_WATCHDOG = "1"   # README.md:104-113, its run settings
VICTORY_PIPELINE_WAIT_MS = "24"
VICTORY_RELAY = "1"
VICTORY_LATE_WAIT = "3"
VICTORY_CARD_BUFFERS_MIN_MB = "1"
VICTORY_CARD_BUFFERS_MB = "1024"
VICTORY_INDIRECT_WINDOW = "0"   # README.md settings, off since 39bb53a
VICTORY_SHADER_OPT = "0"
VICTORY_WIDE_MERGE = "1"
FLAMINGO_DISCORD = "0"   # Neonbridge: no presence sent out unless the user turns it on
VICTORY_HEAP_WORKER = "1"   # flamingo-log.cmd:54, README.md:140
VICTORY_AMBIENT = "0.6"   # flamingo-log.cmd:56
VICTORY_SKIP_PIPELINES = "7115e46a79c78f98,59b1ba494f18c894,b8ca32a6899b87fb,659fe9cae59dbd88"   # flamingo-log.cmd:60, README.md:142

# Keyboard as the gamepad, shown by the controls overlay (F1). From
# crates/victory-hle/src/modules/gameinput.rs FALLBACK_BUTTONS and fallback();
# a real controller plays as well.
[controls]
left_stick = "W A S D"
right_stick = "I J K L"
a = "Enter"
b = "Backspace"
x = "X"
y = "Y"
lb = "Q"
rb = "E"
lt = "Z"
rt = "C"
ls = "F"
rs = "H"
dpad = "Arrows"
view = "Tab"
menu = "Esc"
