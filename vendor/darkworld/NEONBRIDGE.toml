# i95 launcher spec for darkworldhm/victory-fork-darkworldhm: author build and run from its README.
name = "darkworld"
fork = "VIctory"
rank = 26   # #26 on vuyp's GTA VI PC race tracker (vuyp.github.io/gta6-pc-race)
about = "darkworldhm 840243e (GPL-3.0): A snapshot of victory-fork with its own changes: 2 to 4 fps in the world, RTX 4070"
upstream = "https://github.com/darkworldhm/victory-fork-darkworldhm"
updated = "2026-11-26"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 29   # GitHub stars when last checked
build = ["cargo", "build", "--release", "-p", "victory", "--locked"]   # README.md:512
exe = "target/release/victory.exe"
run = ["run", "{game_exe}", "--execute"]   # README.md:513
prewarm = ["translate", "{game}", "--warm", "all", "--jobs", "{jobs}"]   # README.md:392
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

preset_series_s = ["--console=series-s"]   # Series S profile (less GPU memory)
preset_dred = ["NEONBRIDGE_DIAG=1", "VICTORY_D3D12_DRED=1"]   # D3D12 crash breadcrumbs in the log (diagnostics build: host.rs reads it only there)
preset_warp = ["NEONBRIDGE_DIAG=1", "VICTORY_D3D12_WARP=1"]   # software GPU (slow; diagnostics build only, host.rs cfg!(feature = "diagnostics"))


preset_8gb = ["VICTORY_RELAY=0", "VICTORY_FILL_WAIT=1", "VICTORY_CARD_BUFFERS_MB=1024", "VICTORY_TEXTURE_BUDGET_MB=5120", "VICTORY_PAGE_WRITES=slots", "VICTORY_AMBIENT=0.6", "VICTORY_TEXTURE_NO_WAIT=1", "VICTORY_WIDE_REFRESH=1", "VICTORY_WIDE_MERGE=1", "VICTORY_JOIN_COPIES=1", "VICTORY_DISPLAY_MODE=1920x1080"]   # VItoriaBr's 8 GB setting (its README.md:290-305), the switches this tree reads

[env]

[controls]
left_stick = "W A S D"
right_stick = "Mouse"
a = "Shift / Enter"
b = "R / Backspace"
x = "Space"
y = "F"
lb = "Tab"
rb = "Q"
lt = "Right mouse"
rt = "Left mouse"
ls = "Ctrl"
rs = "C / Middle mouse"
dpad = "Arrows / Wheel (E right)"
view = "V / M"
menu = "Esc / P"
