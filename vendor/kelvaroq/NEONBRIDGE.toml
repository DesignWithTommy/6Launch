# Neonbridge launcher spec for vendor/kelvaroq: fablinoo's Kelvaroq. Its native engine is fxceless's
# victory-fork f85101b plus its patches (scripts/build_native.py fetches and builds it).
name = "kelvaroq"
fork = "victory-fork"
rank = 21   # #21 on vuyp's GTA VI PC race tracker (vuyp.github.io/gta6-pc-race)
about = "Kelvaroq 92606ea (GPL-3.0): ~10 fps in typical views (7 to 8 in the heaviest) at 4K on an RTX 5080; a tester's 36 min session without a crash; its unreleased direct memory path needs 22 ms of GPU work an open-world frame and holds 30 fps on loading screens; not yet run here"
upstream = "https://github.com/stellarr-studio/kelvaroq"
updated = "2026-11-27 04:40"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 493   # GitHub stars when last checked
build = ["python", "scripts/build_native.py"]   # README.md "Build from source" (fetches victory-fork f85101b)
build_env = ["CARGO_FEATURE_PURE=1"]   # i95: blake3 in pure Rust; its MASM and C objects fail on the long target path under the 6ixpack source folder (A1009, C1083)
watch = ["native", "scripts/build_native.py"]
exe = "target/release/native/kelvaroq-engine.exe"   # build_native.py:20,24 (renamed in f35b0a4)
diag_build = []
run = ["run", "{game_exe}", "--console", "series-x", "--execute"]   # src/native.rs:59-61
prewarm = ["translate", "{game}", "--warm", "all", "--jobs", "{jobs}"]   # victory-fork's own
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false
preset_experimental_render = ["VICTORY_GPU_UPLOAD_READONLY_MB=256", "VICTORY_CARD_READONLY_MB=128", "VICTORY_RECYCLE_COMPARE_SLOTS=1", "VICTORY_GPU_CONSTANT_FILLS=1", "VICTORY_TEXTURE_NO_WAIT=1", "VICTORY_TEXTURE_SCOPED_REMAP=1", "VICTORY_DESCRIPTOR_SYNC_BATCH=1", "VICTORY_ROOT_BIND_CACHE=1", "VICTORY_RELAY_COPY_RUNS=1", "VICTORY_PIPELINE_EARLY_WITHOUT_LIBRARY=1", "VICTORY_SCOPED_CARD_BARRIERS=1"]   # src/native.rs:13-25

preset_8gb = ["VICTORY_RELAY=0", "VICTORY_FILL_WAIT=1", "VICTORY_CARD_BUFFERS_MB=1024", "VICTORY_TEXTURE_BUDGET_MB=5120", "VICTORY_PAGE_WRITES=slots", "VICTORY_TEXTURE_NO_WAIT=1", "VICTORY_WIDE_REFRESH=1", "VICTORY_WIDE_MERGE=1", "VICTORY_JOIN_COPIES=1", "VICTORY_DISPLAY_MODE=1920x1080"]   # VItoriaBr's 8 GB setting (its README.md:290-305) minus AMBIENT, which victory-fork f85101b does not read
preset_8gb_low = ["VICTORY_RELAY=0", "VICTORY_FILL_WAIT=1", "VICTORY_CARD_BUFFERS_MB=1024", "VICTORY_TEXTURE_BUDGET_MB=2560", "VICTORY_PAGE_WRITES=slots", "VICTORY_TEXTURE_NO_WAIT=1", "VICTORY_WIDE_REFRESH=1", "VICTORY_WIDE_MERGE=1", "VICTORY_JOIN_COPIES=1", "VICTORY_DISPLAY_MODE=1920x1080", "VICTORY_HEAP_RECHECK=1"]   # the same with unified's 2560 MB texture budget, plus HEAP_RECHECK (read by f85101b)
preset_small = ["VICTORY_TEXTURE_STAGE_MB=64", "VICTORY_CARD_BUFFERS_MB=256", "VICTORY_QUEUE2_LANDING_MB=32"]   # README.md:194-196: its launcher on small cards
preset_10gb = ["VICTORY_TEXTURE_STAGE_MB=128", "VICTORY_CARD_BUFFERS_MB=512", "VICTORY_QUEUE2_LANDING_MB=64"]   # README.md:194-196
preset_16gb = ["VICTORY_TEXTURE_STAGE_MB=192", "VICTORY_CARD_BUFFERS_MB=1024", "VICTORY_QUEUE2_LANDING_MB=96"]   # README.md:194-196

[env]
VICTORY_DATA_DIR = "%LOCALAPPDATA%\\6ixpack\\save"   # Neonbridge: one save/settings folder for the victory family

[controls]
left_stick = "W A S D"
right_stick = "I J K L"
a = "Enter"
b = "Backspace"
x = "X"
y = "Y"
lb = "Q"
rb = "E"
lt = "Z"
rt = "C"
ls = "F"
rs = "H"
dpad = "Arrows"
view = "Tab"
menu = "Esc"
