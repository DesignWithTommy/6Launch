name = "cblvictory"
fork = "VIctory"
rank = 34   # i95 rank: score 57.6 by PortWatch VI's formula (from the author's report; scripts/rank.py)
about = "cblvictoryvi 4bb264b (GPL-3.0): now on Vice-Tay's renderer: about 12-15 fps at Series X 1440p, RTX 5080"
upstream = "https://github.com/cocainebunnylaboratories/cblvictoryvi"
updated = "2026-11-27 14:25"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 9   # GitHub stars when last checked
# Now on Vice-Tay's renderer (branch vice-tay-5080-tuning); settings are scripts/play.ps1's defaults on an NVIDIA card
# (its -Machine auto picks the 4090 profile for NVIDIA), not -Safe, no ray tracing, Series X, full screen, panel on.
build = ["cargo", "build", "--locked", "--profile", "diag", "-p", "victory", "--features", "diagnostics"]   # README.md:18 (play.ps1 -Build diag, its default)
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
exe = "target/diag/victory.exe"
diag_build = ["cargo", "build", "--locked", "--profile", "diag", "-p", "victory", "--features", "diagnostics"]
diag_exe = "target/diag/victory.exe"
run = ["run", "{game_exe}", "--console", "series-x", "--execute"]   # play.ps1:187
prewarm = ["shaders", "{game}"]   # play.ps1: victory shaders <game> when the cache is small
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

preset_series_s = ["--console=series-s"]
preset_safe = ["VICTORY_THIN=", "VICTORY_JOIN_PARTS=", "VICTORY_UPLOAD_AHEAD=", "VICTORY_INDIRECT_BATCH=", "VICTORY_MAP_THREADS=", "VICTORY_PLACED_ORDER=", "VICTORY_UNDER_WIDE=0", "VICTORY_LAND_ECHO=0"]   # play.ps1 -Safe
preset_ray_tracing = ["VICTORY_BVH_BUILDER=1"]   # play.ps1 -RayTracing: about a third slower
preset_windowed = ["VICTORY_FULLSCREEN="]   # play.ps1 -Windowed
preset_5080 = ["VICTORY_MAP_THREADS=4", "VICTORY_FAST_CORES=2", "VICTORY_D3D12_DRED=faults", "VICTORY_FRAMEGEN=0", "VICTORY_READBACK_POOL=0"]   # play.ps1 -Machine 5080 (its measurements)
preset_4070 = ["VICTORY_THIN_THREADS=8", "VICTORY_UNDER_THREADS=6", "VICTORY_LAND_THREADS=4", "VICTORY_MAP_THREADS=1", "VICTORY_PIPELINE_WORKERS=3", "VICTORY_CARD_RESERVE_BUDGETS=1", "VICTORY_CARD_BUFFERS_MIN_KB=64", "VICTORY_CARD_BUFFERS_MB=1536", "VICTORY_CARD_WINDOWS_MB=1024"]   # play.ps1 -Machine 4070 (8-core CPU)
preset_amd = ["VICTORY_THIN_THREADS=", "VICTORY_UNDER_THREADS=", "VICTORY_LAND_THREADS=", "VICTORY_PLACED_ORDER=", "VICTORY_WAVE_WIDE_ONLY=", "VICTORY_MAP_THREADS=1", "VICTORY_CARD_AWAKE=1"]   # play.ps1 -Machine 7900xtx (auto on non-NVIDIA)
preset_dred = ["VICTORY_D3D12_DRED=1"]
preset_8gb = ["VICTORY_RELAY=0", "VICTORY_CARD_BUFFERS_MB=1024", "VICTORY_TEXTURE_BUDGET_MB=5120", "VICTORY_PAGE_WRITES=slots", "VICTORY_TEXTURE_NO_WAIT=1", "VICTORY_WIDE_REFRESH=1", "VICTORY_WIDE_MERGE=1", "VICTORY_JOIN_COPIES=1", "VICTORY_DISPLAY_MODE=1920x1080"]   # VItoriaBr's 8 GB setting, minus FILL_WAIT (this Vice-Tay tree does not read it)

[env]   # play.ps1 defaults, NVIDIA (4090) profile
VICTORY_DATA_DIR = "%LOCALAPPDATA%\\6ixpack\\save"   # i95: one save/settings folder for the victory family
VICTORY_TEXTURE_NO_WAIT = "1"
VICTORY_RELAY = "2"
VICTORY_WIDE_BACK = "1"
VICTORY_CARD_REHASH_RUNS = "1"
VICTORY_JOIN_COPIES = "1"
VICTORY_INDIRECT_WINDOW = "1"
VICTORY_RELAY_COPY = "1"
VICTORY_CARD_STEPS = "2"
VICTORY_TITLE_PRIORITIES = "0"
VICTORY_SHOW_AFTER = "1"
VICTORY_AMBIENT = "0.8"
VICTORY_D3D12_DRED = "light"
VICTORY_THIN_THREADS = "12"
VICTORY_UNDER_THREADS = "8"
VICTORY_LAND_THREADS = "6"
VICTORY_MAP_THREADS = "auto"
VICTORY_PLACED_ORDER = "1"
VICTORY_WAVE_WIDE_ONLY = "6f225b641c5b0708,5dc3b25986622949,369cbe906ea72764,2cc4c197ee29e291"
VICTORY_THIN = "1"
VICTORY_JOIN_PARTS = "8"
VICTORY_UPLOAD_AHEAD = "1"
VICTORY_INDIRECT_BATCH = "2"
VICTORY_FULLSCREEN = "1"
VICTORY_PANEL = "1"

[controls]
left_stick = "W A S D"
right_stick = "I J K L"
a = "Enter"
b = "Backspace"
x = "X"
y = "Y"
lb = "Q"
rb = "E"
lt = "Z"
rt = "C"
ls = "F"
rs = "H"
dpad = "Arrows"
view = "Tab"
menu = "Esc"
