# i95 launcher spec for cocainebunnylaboratories/cblvictoryvi: author build and run from its README.
name = "cblvictory"
fork = "VIctory"
rank = 19   # #19 on vuyp's GTA VI PC race tracker (vuyp.github.io/gta6-pc-race)
about = "cblvictoryvi ed3b1cb (GPL-3.0): A 65 min session: 11.4 fps on the boat, 4.3 to 4.7 in the city, RTX 5080"
upstream = "https://github.com/cocainebunnylaboratories/cblvictoryvi"
updated = "2026-11-27 11:45"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 8   # GitHub stars when last checked
build = ["cargo", "build", "--release", "-p", "victory", "--locked"]   # README.md:370
exe = "target/release/victory.exe"
run = ["run", "{game_exe}", "--execute"]   # README.md:371
prewarm = ["translate", "{game}", "--warm", "all", "--jobs", "{jobs}"]   # README.md:254
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

preset_series_s = ["--console=series-s"]   # Series S profile (less GPU memory)
preset_dred = ["NEONBRIDGE_DIAG=1", "VICTORY_D3D12_DRED=1"]   # D3D12 crash breadcrumbs in the log (diagnostics build: host.rs reads it only there)
preset_warp = ["NEONBRIDGE_DIAG=1", "VICTORY_D3D12_WARP=1"]   # software GPU (slow; diagnostics build only, host.rs cfg!(feature = "diagnostics"))


preset_8gb = ["VICTORY_RELAY=0", "VICTORY_FILL_WAIT=1", "VICTORY_CARD_BUFFERS_MB=1024", "VICTORY_TEXTURE_BUDGET_MB=5120", "VICTORY_PAGE_WRITES=slots", "VICTORY_TEXTURE_NO_WAIT=1", "VICTORY_WIDE_REFRESH=1", "VICTORY_WIDE_MERGE=1", "VICTORY_JOIN_COPIES=1", "VICTORY_DISPLAY_MODE=1920x1080"]   # VItoriaBr's 8 GB setting (its README.md:290-305), the switches this tree reads

[env]

[controls]
left_stick = "W A S D"
right_stick = "I J K L"
a = "Enter"
b = "Backspace"
x = "X"
y = "Y"
lb = "Q"
rb = "E"
lt = "Z"
rt = "C"
ls = "F"
rs = "H"
dpad = "Arrows"
view = "Tab"
menu = "Esc"
