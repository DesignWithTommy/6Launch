# Neonbridge launcher spec for vendor/rorodev: rorodev6's victory.
# Build and env are its play.ps1 (diag build, Series S).

name = "rorodev"
fork = "VIctory"
gpu = "NVIDIA"   # the card it is tuned for (README; the picker's filter)
rank = 52   # i95 rank: score 55.8 by PortWatch VI's formula (i95's assessment from its author's report; scripts/rank.py)
about = "rorodev6/victory 8604369 (GPL-3.0): VIctory with an fps counter and shader fixes; prologue 7-9 fps (author); not yet run here"
upstream = "https://github.com/rorodev6/victory"
updated = "2026-11-25 14:28"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 84   # GitHub stars when last checked
build = ["cargo", "build", "--locked", "--profile", "diag", "-p", "victory", "--features", "diagnostics"]
exe = "target/diag/victory.exe"
run = ["run", "{game_exe}", "--execute", "--console", "series-s"]   # play.ps1
prewarm = ["shaders", "{game}/shaders.rpf", "{game_exe}", "{game}/XboxBvhBuilder.dll", "{game}/amd_fidelityfx_upscaler_xbox.dll", "--jobs", "{jobs}"]
watch = ["apps", "crates", "src", "Cargo.toml", "Cargo.lock", "CMakeLists.txt"]
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

preset_series_x = ["--console=series-x"]   # play.ps1 -SeriesX

[env]   # play.ps1
VICTORY_DISPLAY_MODE = "1280x720"
VICTORY_SHADER_LOOP_LIMIT = "256"
VICTORY_RELAY = "2"
VICTORY_INDIRECT_WINDOW = "1"
VICTORY_LATE_WAIT = "3"
VICTORY_WIDE_BACK = "1"
VICTORY_CARD_BUFFERS_MIN_MB = "1"
VICTORY_CARD_BUFFERS_MB = "1024"
VICTORY_JOIN_COPIES = "1"
VICTORY_CARD_REHASH_RUNS = "1"
