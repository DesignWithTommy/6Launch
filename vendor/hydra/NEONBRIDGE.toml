# Neonbridge launcher spec for vendor/hydra: tolimanl's VIctory-Hydra.
# Build and env are its Play-VIctory.cmd (release build); its D3D12 Agility copy comes from i95.

name = "hydra"
fork = "VIctory"
gpu = "NVIDIA"   # the card it is tuned for (README; the picker's filter)
rank = 33   # i95 rank: score 59.5 by PortWatch VI's formula (i95's assessment from its author's report; scripts/rank.py)
about = "VIctory-Hydra 85e7e07 (GPL-3.0): ~18-20 fps at 1080p (37-40 shown with FSR 3 frame generation), RTX 3060 and Ryzen 5 5600X; 'not ready for full playthroughs'; not yet run here"
upstream = "https://github.com/tolimanl/victory-hydra"
updated = "2026-11-28 08:34"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 77   # GitHub stars when last checked
build = ["cargo", "build", "--release", "--locked", "-p", "victory"]
exe = "target/release/victory.exe"
run = ["run", "{game_exe}", "--console", "series-s", "--execute"]   # Play-VIctory.cmd
prewarm = ["shaders", "{game}/shaders.rpf", "{game_exe}", "{game}/XboxBvhBuilder.dll", "{game}/amd_fidelityfx_upscaler_xbox.dll", "--jobs", "{jobs}"]
watch = ["apps", "crates", "src", "Cargo.toml", "Cargo.lock", "CMakeLists.txt"]
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = true   # Play-VIctory.cmd needs D3D12\D3D12Core.dll beside the exe

[env]   # Play-VIctory.cmd
VICTORY_PORT_CONSTANTS = "0"
VICTORY_PORT_DESCRIPTORS = "1"
