# ScarlettPort's victory runtime (engine). Its second runtime, runtime/xcl, is a distinct
# playable path (scripts/setup.ps1:15 `cargo build --release` in runtime\xcl -> runtime\xcl\target\release\xcl.exe,
# scripts/play.ps1:34 `xcl run <game>` with XCL_DXC_THREADS=4, XCL_NO_WATCHDOG=1, XCL_PRESS_FILE); not modelled here.
name = "scarlettport"
fork = "victory-fork"
gpu = "NVIDIA"   # the card it is tuned for (README "Tuned for"; the picker's filter)
rank = 56   # i95 rank: score 55.6 by PortWatch VI's formula (from the author's report; scripts/rank.py)
about = "ScarlettPort 745d6f3 (GPL-3.0): about 7 to 8 fps in the world with a warm cache on 0.5.2, Series S, RTX 3060; not yet run here"
upstream = "https://github.com/ZigZagBoi1/ScarlettPort"
updated = "2026-11-27 19:57"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 1365   # GitHub stars when last checked
# scripts/setup-scarlett.ps1:18,21 (run in engine; --manifest-path keeps that workspace's own target dir)
build = ["cargo", "rustc", "--manifest-path", "engine/Cargo.toml", "--release", "-p", "scarlett", "--bin", "scarlett", "--features", "diagnostics", "--locked", "--", "-C", "link-arg=/EXPORT:D3D12SDKVersion,DATA", "-C", "link-arg=/EXPORT:D3D12SDKPath,DATA"]
watch = ["engine/apps", "engine/crates", "engine/Cargo.toml", "engine/Cargo.lock"]
exe = "engine/target/release/scarlett.exe"   # scripts/play-scarlett.ps1:42
# NEONBRIDGE_DIAG (on unless 0): the author's diagnostics build, used in place of build/exe; [] = none.
diag_build = []   # its default build already has --features diagnostics (play-scarlett.ps1 build, as above): nothing else to switch
cwd = "engine/target/release"
run = ["run", "{game_exe}", "--execute", "--console", "series-s"]   # play-scarlett.ps1:24,45,88
prewarm = ["shaders", "{game}"]   # play-scarlett.ps1 (4866673): scarlett shaders <game>, then warm
game_env = "SCARLETT_GAME_DIR"       # play-scarlett.ps1:50
cache_env = "SCARLETT_CACHE_DIR"   # Neonbridge: this runtime's own %LOCALAPPDATA%\6ixpack\scarlettport\cache (translators differ)
agility = true                      # setup-scarlett.ps1:27-38 (Agility 1.614.1 into <exe dir>\D3D12)

# options: KEY=values (default X): text. Env names grepped from the Rust source (first read site); defaults "unset" unless noted
