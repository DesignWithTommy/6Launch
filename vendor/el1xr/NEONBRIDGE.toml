# Neonbridge launcher spec for vendor/el1xr: kylepelham's El1xr (Bone/Nevaa).
# Build is tools/dev.py; env is the tuned set of tools/lancer_victory.ps1.

name = "el1xr"
fork = "VIctory"
gpu = "NVIDIA"   # the card it is tuned for (README; the picker's filter)
rank = 10   # i95 rank: score 66.8 by PortWatch VI's formula (i95's assessment from its author's report; scripts/rank.py)
about = "El1xr 31442c9 (GPL-3.0): VIctory tuned by Bone/Nevaa: 23.1-25.7 fps at 4K on an RTX 5090, playable in the open world (author); not yet run here"
upstream = "https://github.com/kylepelham/El1xr"
updated = "2026-11-28 03:05"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 23   # GitHub stars when last checked
build = ["cargo", "build", "--release", "-p", "victory", "--manifest-path", "third_party/victory/Cargo.toml"]   # tools/dev.py:531
exe = "third_party/victory/target/release/victory.exe"
run = ["run", "{game_exe}", "--execute"]   # tools/lancer_victory.ps1:461 (Series X)
watch = ["apps", "crates", "src", "Cargo.toml", "Cargo.lock", "CMakeLists.txt"]
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

