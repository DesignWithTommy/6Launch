# i95 launcher spec for LoverCatys/ruff-lab: author build and run from its README.
name = "rufflab"
fork = "klbf-lab"
gpu = "AMD 8 GB"   # the card it is tuned for (README "Tuned for"; the picker's filter)
rank = 14   # i95 rank: score 63.3 by PortWatch VI's formula (from the author's report; scripts/rank.py)
about = "ruff-lab ef46d4a (GPL-3.0): Built for 8 GB cards and 16 GB RAM: 6 to 7 fps by scene at 720p upscaled, 30 to 39 min runs without a crash, RX 6600 XT; not yet run here"
upstream = "https://github.com/LoverCatys/ruff-lab"
updated = "2026-11-27 18:19"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 10   # GitHub stars when last checked
build = ["cargo", "build", "--release", "-p", "victory", "--locked"]   # README.md:65
exe = "target/release/victory.exe"
run = ["run", "--console", "series-s", "{game_exe}", "--execute"]   # README.md:87
prewarm = ["translate", "--cache", "--pipelines", "--jobs", "{jobs}", "{game}/shaders.rpf"]   # README.md:73
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

preset_series_s = ["--console=series-s"]   # Series S profile (less GPU memory)
preset_dred = ["NEONBRIDGE_DIAG=1", "VICTORY_D3D12_DRED=1"]   # D3D12 crash breadcrumbs in the log (diagnostics build: host.rs reads it only there)
preset_warp = ["NEONBRIDGE_DIAG=1", "VICTORY_D3D12_WARP=1"]   # software GPU (slow; diagnostics build only, host.rs cfg!(feature = "diagnostics"))


[env]
VICTORY_SHADER_OPT = "0"   # README.md:79-85, its run settings
VICTORY_SKIP_PIPELINES = "39f0e9aeb156a61c"   # docs/klbf/skip-amd.txt
VICTORY_LATE_WAIT = "3"   # README.md:91
VICTORY_WIDE_BACK = "1"
VICTORY_PIPELINE_WAIT_MS = "250"   # README.md:110
VICTORY_DSTORAGE_WORKERS = "3"
VICTORY_RELAY_COPY_QUEUE = "0"
VICTORY_WIDE_MERGE = "1"
VICTORY_WIDE_REFRESH = "1"
VICTORY_WIDE_THREADS = "6"
VICTORY_UNDER_WRITES_WORDS = "0"
VICTORY_UNDER_WRITES_RUNS = "100000"
VICTORY_UNDER_WRITES_MASKS = "1"
VICTORY_UNDER_WRITES_MASKS_LEAST = "1"
VICTORY_CARD_FETCH_INFLIGHT = "1"
VICTORY_COPY_CHANGED = "1"
VICTORY_RANGED = "1"
VICTORY_HEAP_RESCAN_FRAMES = "64"
VICTORY_CARD_BUFFERS_MB = "1024"
VICTORY_CARD_REHASH_RUNS = "1"
VICTORY_JOIN_COPIES = "1"
VICTORY_PIPELINE_WORKERS = "4"
VICTORY_COMMIT_RESERVE_MB = "2048"
VICTORY_REMAP_LEAN = "1"
VICTORY_TEXTURE_MAX_DIM = "1024"
VICTORY_TEXTURE_LRU = "1"
VICTORY_TEXTURE_ROOM_PERCENT = "92"
VICTORY_TEXTURE_KEEP_PERCENT = "78"
VICTORY_DYNAMIC_SLOTS = "524288"
VICTORY_DISPLAY_MODE = "1280x720"
VICTORY_AMBIENT_SHADE = "0"

[controls]
left_stick = "W A S D"
right_stick = "I J K L"
a = "Enter"
b = "Backspace"
x = "X"
y = "Y"
lb = "Q"
rb = "E"
lt = "Z"
rt = "C"
ls = "F"
rs = "H"
dpad = "Arrows"
view = "Tab"
menu = "Esc"
