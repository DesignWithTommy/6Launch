# Neonbridge launcher spec for vendor/amd4k: elaboratecl's VIctory-AMD-4K.
# Build and env are its launch_gta6.cmd (release build).

name = "amd4k"
fork = "VIctory"
gpu = "AMD"   # the card it is tuned for (README; the picker's filter)
rank = 41   # i95 rank: score 58.0 by PortWatch VI's formula (i95's assessment from its author's report; scripts/rank.py)
about = "VIctory-AMD-4K ff7d74d (GPL-3.0): native 4K Series X on AMD: 13.0-16.1 fps, Ryzen 5 5600, RX 6800 16 GB, 16 GB RAM; not yet run here"
upstream = "https://github.com/elaboratecl/victory-amd-4k"
updated = "2026-11-28 12:29"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 6   # GitHub stars when last checked
build = ["cargo", "build", "--release", "--locked", "-p", "victory"]
exe = "target/release/victory.exe"
run = ["run", "{game_exe}", "--console", "series-x", "--execute"]   # launch_gta6.cmd
prewarm = ["shaders", "{game}/shaders.rpf", "{game_exe}", "{game}/XboxBvhBuilder.dll", "{game}/amd_fidelityfx_upscaler_xbox.dll", "--jobs", "{jobs}"]
watch = ["apps", "crates", "src", "Cargo.toml", "Cargo.lock", "CMakeLists.txt"]
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

[env]   # launch_gta6.cmd
VICTORY_FRAME_INTERVAL_MS = "0"
VICTORY_ASK_NORESET = "1"
