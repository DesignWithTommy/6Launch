# Launcher spec for vendor/apexvi: KevinPratap's ApexVI, a VIctory fork tuned for 6-8 GB laptop cards (RTX 4050).
# Build and run are its README "How to run it" (README.md:79-80) and scripts/play.ps1 (9a17be6).
name = "apexvi"
fork = "VIctory"
gpu = "NVIDIA 6-8 GB"   # the card it is tuned for (README "Tuned for"; the picker's filter)
rank = 27   # i95 rank: score 61.0 by PortWatch VI's formula (from the author's report; scripts/rank.py)
about = "ApexVI e916354 (GPL-3.0): a controllable character at 6.35 to 7.5 fps by scene, 14 to 15 min runs without a crash, laptop RTX 4050 6 GB, Series S 1080p; not yet run here"
upstream = "https://github.com/KevinPratap/ApexVI"
updated = "2026-11-28 16:02"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 4   # GitHub stars when last checked
build = ["cargo", "build", "--locked", "--profile", "diag", "-p", "victory", "--features", "diagnostics"]   # README.md:79
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
exe = "target/diag/victory.exe"   # play.ps1:13 (-Build diag)
run = ["run", "{game_exe}", "--execute", "--console", "series-s"]   # play.ps1:62
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

preset_safe = ["VICTORY_COPY_PLAIN=", "VICTORY_COPY_PLAIN_LEAST=", "VICTORY_ASYNC_PRESENT=", "VICTORY_FRAMES_AHEAD=", "VICTORY_CARD_HASH_WAVE=", "VICTORY_MERGE_MASKED=", "VICTORY_MERGE_MASKED_INDEX=", "VICTORY_MERGE_BUFFERS=", "VICTORY_MERGE_CHUNKS=", "VICTORY_WATCH_TEXTURES_JOINED=", "VICTORY_WATCH_VIEWS_SKIP=", "VICTORY_FILL_AHEAD_COPY_MISS=", "VICTORY_COPY_AFTER_LANDING=", "VICTORY_COPY_AHEAD=", "VICTORY_GUARD_ABSENT_CACHE=", "VICTORY_GUARD_REST=", "VICTORY_OPEN_ONE_VIEW=", "VICTORY_GUARD_BITS=", "VICTORY_FINE_PAGES=", "VICTORY_MIRROR_FAST=", "VICTORY_CLZERO_REGIONS=", "VICTORY_JOURNAL_SPLIT=", "VICTORY_WIDE_REFRESH=", "VICTORY_TEXTURE_MIP_DROP_UI_FULL=", "VICTORY_BC7_ROTATION=", "VICTORY_MESH_9BIT_CORNERS=", "VICTORY_INDIRECT_ZERO_GARBAGE=", "VICTORY_SDWA_SEXT_16=", "VICTORY_SYNC_BARRIER=", "VICTORY_TEXTURE_CHANGING=", "VICTORY_PAGE_WRITES=", "VICTORY_SPATIAL_NO_JITTER=", "VICTORY_PREP_SPLIT=", "VICTORY_PARALLEL_REFRESH=", "VICTORY_SECTION_MB=", "VICTORY_HEAP_WALK_THREAD=", "VICTORY_CARD_REHASH_RUNS=", "VICTORY_REAPER=", "VICTORY_LDS_FLAGS=", "VICTORY_NARROW_RAW_LOADS=", "VICTORY_LEGACY_FMAD="]   # play.ps1 -Safe: without the newest switches

