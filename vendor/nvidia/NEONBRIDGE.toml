# Neonbridge launcher spec for vendor/nvidia: trustno1-coder's VIctory-NVIDIA (NVIDIA speed set on the 7900XTX base).
# Build and env are its README "Build" section and scripts/play-nvidia.ps1 (default: the speed set, Series S).
name = "nvidia"
fork = "VIctory"
rank = 29   # #29 on vuyp's GTA VI PC race tracker (vuyp.github.io/gta6-pc-race)
about = "VIctory-NVIDIA 9e7ab9d (GPL-3.0): 20 to 22 fps indoors on an RTX 5070, at half render scale on the Series S profile; no session length given; not yet run here"
upstream = "https://github.com/trustno1-coder/VIctory-NVIDIA"
build = ["cargo", "build", "--locked", "--profile", "diag", "-p", "victory", "--features", "diagnostics"]   # README.md:234
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
exe = "target/diag/victory.exe"
diag_build = []
run = ["run", "{game_exe}", "--execute", "--console", "series-s"]   # play-nvidia.ps1:104-105 (Series S unless -SeriesX)
prewarm = ["shaders", "{game}/shaders.rpf", "{game_exe}", "{game}/XboxBvhBuilder.dll", "{game}/amd_fidelityfx_upscaler_xbox.dll"]   # its 7900XTX base's warm
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

preset_quality = ["VICTORY_RELAY=1", "VICTORY_CARD_STEPS=0", "VICTORY_TEXTURE_NO_WAIT=0"]   # play-nvidia.ps1 -Quality: fewer stretched bodies, less rainbow skin, ~13 fps
preset_8gb = ["VICTORY_CARD_BUFFERS_MB=1024", "VICTORY_TEXTURE_BUDGET_MB=5120"]   # ours: its 1536 MB card buffers trimmed for 8 GB cards

[env]   # play-nvidia.ps1:30-56, its default speed set
VICTORY_DATA_DIR = "%LOCALAPPDATA%\\6ixpack\\save"   # Neonbridge: one save/settings folder for the victory family
VICTORY_TEXTURE_NO_WAIT = "1"
VICTORY_RELAY = "2"
VICTORY_CARD_STEPS = "2"
VICTORY_WIDE_BACK = "1"
VICTORY_CARD_REHASH_RUNS = "1"
VICTORY_JOIN_COPIES = "1"
VICTORY_INDIRECT_WINDOW = "1"
VICTORY_RELAY_COPY = "1"
VICTORY_WINDOWS_BAR_MB = "3072"   # play-nvidia.ps1:89-93: 3072 under 24 GB RAM (0 above); kept on, harmless with more RAM
VICTORY_INDIRECT_BATCH = "2"
VICTORY_MAP_THREADS = "1"
VICTORY_TITLE_PRIORITIES = "0"
VICTORY_CARD_AWAKE = "1"
VICTORY_SHOW_AFTER = "1"
VICTORY_AMBIENT = "0.8"
VICTORY_D3D12_DRED = "light"
VICTORY_SKIP_PIPELINES = "none"
VICTORY_THIN = "1"
VICTORY_JOIN_PARTS = "8"
VICTORY_UPLOAD_AHEAD = "1"
VICTORY_AMBIENT_AIR = "1.5"
VICTORY_AMBIENT_MOST = "2"
VICTORY_NAN_SCRUB = "1"
VICTORY_PIPELINE_WAIT_MS = "10000"
VICTORY_DYNAMIC_SLOTS = "524288"
VICTORY_RENDER_SCALE = "0.5"
VICTORY_OWN_UPSCALER = "1"
VICTORY_BVH_MISS = "1"
VICTORY_CARD_BUFFERS_MIN_MB = "1"
VICTORY_CARD_BUFFERS_MB = "1536"
VICTORY_COMPOSE = "1"

[controls]
left_stick = "W A S D"
right_stick = "I J K L"
a = "Enter"
b = "Backspace"
x = "X"
y = "Y"
lb = "Q"
rb = "E"
lt = "Z"
rt = "C"
ls = "F"
rs = "H"
dpad = "Arrows"
view = "Tab"
menu = "Esc"
