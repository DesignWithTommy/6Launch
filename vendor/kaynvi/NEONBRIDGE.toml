# Neonbridge launcher spec for vendor/kaynvi: caionickpi's KaynVI-Fork-GTA6 (mid-range, <= 8 GB).
# Build is README.md:59-62; env is scripts/run-gtavi-rx7600.ps1 with no switches (README.md:63), the launch the README names
# (not scripts/play.ps1, the upstream Belobug script left in the tree).

name = "kaynvi"
fork = "VIctory"
gpu = "AMD 8 GB"   # the card it is tuned for (README.md:42-47: RX 7600 8 GB, Ryzen 5 5600; the picker's filter)
rank = 71   # i95 rank: score 40.0 by PortWatch VI's formula (i95's assessment from its author's report; scripts/rank.py)
about = "KaynVI-Fork-GTA6 6b717b7 (GPL-3.0): a VIctory/Belobug-AMD fork for mid-range PCs with up to 8 GB of VRAM, tuned on an RX 7600 (author reports no fps numbers); not yet run here"
upstream = "https://github.com/caionickpi/kaynvi-fork-gta6"
updated = "2026-11-27 19:07"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 1   # GitHub stars when last checked
build = ["cargo", "build", "--release", "--locked"]   # README.md:61 (+--locked)
exe = "target/release/victory.exe"   # scripts/run-gtavi-rx7600.ps1:7, 14 (-Build release)
diag_build = ["cargo", "build", "--locked", "--profile", "diag", "-p", "victory", "--features", "diagnostics"]   # Cargo.toml:78
diag_exe = "target/diag/victory.exe"   # Cargo.toml:80 [profile.diag]
cwd = "."   # scripts/run-gtavi-rx7600.ps1:186 (Push-Location $repo)
run = ["run", "{game_exe}", "--execute", "--console", "series-s"]   # scripts/run-gtavi-rx7600.ps1:4, 194
prewarm = ["warm", "--used"]   # scripts/run-gtavi-rx7600.ps1:188-191 (before every start unless -SkipWarm)
watch = ["apps", "crates", "xtask", "Cargo.toml", "Cargo.lock", ".cargo"]   # Cargo.toml:3 members; README.md:37 (.cargo/config.toml)
game_env = "VICTORY_GAME_DIR"   # scripts/run-gtavi-rx7600.ps1:181
cache_env = "VICTORY_CACHE_DIR"   # scripts/run-gtavi-rx7600.ps1:181
agility = false   # no D3D12SDKVersion export in the tree
# Not copied: run-gtavi-rx7600.ps1:37-83 rewrites the title's settings.xml (RT shadows, motion blur off, LOD, 60 fps limit)
# and :164-166 sets VICTORY_GAME_OVERLAY_DIR only when its C:\GTA6-SSD-Hot folder exists.

# scripts/run-gtavi-rx7600.ps1's switches (:3-10)
preset_balanced = ["VICTORY_OUTPUT=1664x936", "VICTORY_CARD_ROOM_FOR_TARGETS_MB=1360"]   # -Preset balanced (:24, 27-31, 85-89)
preset_quality = ["VICTORY_OUTPUT=1920x1080", "VICTORY_CARD_ROOM_FOR_TARGETS_MB=1536"]   # -Preset quality (:25, 27-31, 85-89)
preset_series_x = ["--console=series-x"]   # -Console series-x (:4)
preset_cap30 = ["VICTORY_FRAME_INTERVAL_MS="]   # -Cap30 (:168-170: the interval left unset)
preset_safe = ["VICTORY_UNDER_WIDE=0", "VICTORY_LAND_ECHO=0", "VICTORY_THIN=0", "VICTORY_JOIN_PARTS=0", "VICTORY_UPLOAD_AHEAD=0"]   # -Safe (:172-179: the script leaves the non-safe ones unset; 0 here)

[env]   # scripts/run-gtavi-rx7600.ps1:91-179 (-Preset performance -> 1280x720)
VICTORY_TEXTURE_NO_WAIT = "1"
VICTORY_RELAY = "2"
VICTORY_WIDE_BACK = "1"
VICTORY_CARD_REHASH_RUNS = "1"
VICTORY_JOIN_COPIES = "1"
VICTORY_INDIRECT_WINDOW = "1"
VICTORY_RELAY_COPY = "1"
VICTORY_CARD_STEPS = "2"
VICTORY_INDIRECT_BATCH = "2"
VICTORY_MAP_THREADS = "1"
VICTORY_TITLE_PRIORITIES = "1"   # :92, 103 ("never 0 on 6 cores")
VICTORY_CARD_AWAKE = "1"
VICTORY_SHOW_AFTER = "1"
VICTORY_OUTPUT = "1280x720"   # :23, 111
VICTORY_UPSCALER = "6"
VICTORY_LEVELS_ON_DEMAND = "0"
VICTORY_BURY_LAG = "128"
VICTORY_JOIN_BARRIERS = "1"
VICTORY_SYNC_FINE = "1"
VICTORY_TEXTURE_ROOM_PERCENT = "92"
VICTORY_TEXTURE_LOOK_MS = "750"
VICTORY_TEXTURE_STAGE_MB = "256"
VICTORY_CARD_ROOM_FOR_TARGETS_MB = "1200"   # :85-86, 120
VICTORY_CARD_BUFFERS_MIN_KB = "64"
VICTORY_CARD_BUFFERS_MB = "832"
VICTORY_WINDOWS_BAR_MB = "0"
VICTORY_KEEP_FREED = "0"
VICTORY_RESIDENCY = "1"
VICTORY_RESIDENCY_LIMITED = "1"
VICTORY_D3D12_BACKGROUND = "0"
VICTORY_WINDOW_KB = "4096"   # :130-134
VICTORY_WINDOW_TAILS = "0"
VICTORY_WINDOW_BUDGET_MB = "1024"
VICTORY_SNAPSHOT_POOL = "32"
VICTORY_LATE_WAIT_LISTS = "128"
VICTORY_LANE_CORE = "0"   # :137-146 (Ryzen 5 5600 6c/12t)
VICTORY_GUARD_HOT = "120"
VICTORY_GUARD_REST = "6000"
VICTORY_THIN_THREADS = "6"
VICTORY_LAND_THREADS = "2"
VICTORY_LAND_SKIP = "1"
VICTORY_PIPELINE_WORKERS = "2"
VICTORY_PIPELINE_WAIT_MS = "25"
VICTORY_PIPELINE_BOOK = "1"
RUST_LOG = "warn,victory_gpu::host=info,victory_hle::modules::dstorage=info"
VICTORY_DSTORAGE_WORKERS = "8"   # :149-151
VICTORY_DSTORAGE_HDD_WORKERS = "4"
VICTORY_DSTORAGE_STAGING_MB = "256"
VICTORY_AMBIENT = "1.0"   # :154-161
VICTORY_D3D12_DRED = "light"
VICTORY_PORT_CONSTANTS = "1"
VICTORY_PORT_DESCRIPTORS = "1"
VICTORY_PORT_CBV = "1"
VICTORY_PORT_GUARD = "1"
VICTORY_PORT_JOURNAL = "1"
VICTORY_KBM_GTA = "1"
VICTORY_FRAME_INTERVAL_MS = "16.667"   # :168-170 (not -Cap30)
VICTORY_THIN = "1"   # :176-178 (not -Safe)
VICTORY_JOIN_PARTS = "8"
VICTORY_UPLOAD_AHEAD = "1"
