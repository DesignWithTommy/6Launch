name = "sm86"
fork = "VIctory"
gpu = "NVIDIA"   # the card it is tuned for (README "Tuned for"; the picker's filter)
rank = 16   # i95 rank: score 62.6 by PortWatch VI's formula (from the author's report; scripts/rank.py)
about = "VIctory_sm86 f890cb5 (GPL-3.0): 27-30 fps in the opening on an RTX 3090 (Series X 1440p, DLSS Quality); not yet run here"
upstream = "https://github.com/whiteh4cker-tr/VIctory_sm86"
updated = "2026-11-27 08:47"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 53   # GitHub stars when last checked
build = ["cargo", "build", "--release", "--locked", "-p", "victory"]   # README.md:95; Play-VIctory.cmd:15
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
exe = "target/release/victory.exe"   # Play-VIctory.cmd:13
diag_build = ["cargo", "build", "--locked", "--profile", "diag", "-p", "victory", "--features", "diagnostics"]   # README.md:99
diag_exe = "target/diag/victory.exe"   # Cargo.toml:78 [profile.diag]
cwd = "target/release"
run = ["run", "{game_exe}", "--console", "series-s", "--execute"]   # Play-VIctory.cmd:39
game_env = "VICTORY_GAME_DIR"   # Play-VIctory.cmd:7-8
cache_env = "VICTORY_CACHE_DIR"   # Play-VIctory.cmd:19 (Neonbridge: this runtime's own cache dir)
prewarm = ["shaders"]   # README.md:137-141 (then `warm`, README.md:188)
agility = false   # not checked in the tree
# DLSS / frame generation: put the files of NVIDIA Streamline SDK bin\x64 in %LOCALAPPDATA%\6ixpack\streamline (not shipped: NVIDIA licence)
preset_framegen = ["VICTORY_DLSS=1", "VICTORY_DLSS_MODE=quality", "VICTORY_STREAMLINE_DIR=%LOCALAPPDATA%\\6ixpack\\streamline", "VICTORY_FRAMEGEN=1", "VICTORY_FRAMEGEN_X=2", "VICTORY_TEXTURE_ROOM_PERCENT=80", "VICTORY_PLACED_ORDER=1", "VICTORY_PIPELINE_BOOK=1"]   # PLAY_FRAMEGEN.cmd mode 3 (scripts/play-framegen.ps1:49,118; play-VIctory_sm86.ps1:98-104): Series S + DLSS Quality + frame gen; needs VICTORY_STREAMLINE_DIR set by the user
preset_dred = ["NEONBRIDGE_DIAG=1", "VICTORY_D3D12_DRED=1"]
preset_warp = ["NEONBRIDGE_DIAG=1", "VICTORY_D3D12_WARP=1"]

# NVIDIA Streamline SDK v2.14.16 (the version its author tested) from NVIDIA-RTX/Streamline releases, its bin\x64 into %LOCALAPPDATA%\6ixpack\streamline for the DLSS presets
setup = [
  "streamline: powershell -NoProfile -Command \"$d=Join-Path $env:LOCALAPPDATA '6ixpack\\streamline'; if (-not (Test-Path (Join-Path $d 'sl.interposer.dll'))) { $t=Join-Path $env:TEMP 'streamline-sdk-v2.14.16.zip'; Invoke-WebRequest -UseBasicParsing https://github.com/NVIDIA-RTX/Streamline/releases/download/v2.14.16/streamline-sdk-v2.14.16.zip -OutFile $t; $x=Join-Path $env:TEMP 'streamline-sdk-v2.14.16'; Expand-Archive -Force $t $x; New-Item -ItemType Directory -Force $d | Out-Null; $b=(Get-ChildItem $x -Recurse -Directory -Filter x64 | Where-Object { $_.Parent.Name -eq 'bin' } | Select-Object -First 1).FullName; Copy-Item (Join-Path $b '*') $d -Recurse -Force; Remove-Item -Recurse -Force $t,$x }\" [asks first: download]",
]

[env]   # Play-VIctory.cmd:18-38 (pareto-residency defaults)
VICTORY_DATA_DIR = "%LOCALAPPDATA%\\6ixpack\\save"   # i95: one save/settings folder for the victory family
VICTORY_AMBIENT_AIR = "1.5"
VICTORY_TEXTURE_NO_WAIT = "1"
VICTORY_RELAY = "2"
VICTORY_WIDE_BACK = "1"
VICTORY_CARD_REHASH_RUNS = "1"
VICTORY_JOIN_COPIES = "1"
VICTORY_INDIRECT_WINDOW = "1"
VICTORY_RELAY_COPY = "1"
VICTORY_CARD_STEPS = "2"
VICTORY_INDIRECT_BATCH = "2"
VICTORY_MAP_THREADS = "1"
VICTORY_CARD_AWAKE = "1"
VICTORY_SHOW_AFTER = "1"
VICTORY_AMBIENT = "0.8"
VICTORY_THIN = "1"
VICTORY_JOIN_PARTS = "8"
VICTORY_UPLOAD_AHEAD = "1"
VICTORY_LEVELS_ON_DEMAND = "1"
VICTORY_CARD_BUFFERS_MIN_KB = "64"
VICTORY_LOG = "warn"
