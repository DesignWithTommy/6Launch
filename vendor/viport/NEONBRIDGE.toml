# Neonbridge launcher spec for vendor/viport: DesertGamer's VIPort.
# Build and run are its README (release build, viport.exe run <exe> --execute).

name = "viport"
fork = "VIPort"
gpu = "any"   # the card it is tuned for (README; the picker's filter)
rank = 69   # i95 rank: score 53.1 by PortWatch VI's formula (i95's assessment from its author's report; scripts/rank.py)
about = "VIPort 59b7938 (GPL-3.0): an independent Xbox Series runtime; boots and runs menus at 30 fps, world not yet playable (author); not yet run here"
upstream = "https://github.com/DesertGamer/VIPort"
updated = "2026-11-26 10:39"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 137   # GitHub stars when last checked
build = ["cargo", "build", "--release", "-p", "viport"]   # README
exe = "target/release/viport.exe"
run = ["run", "{game_exe}", "--execute"]   # README.md:279
watch = ["apps", "crates", "src", "Cargo.toml", "Cargo.lock", "CMakeLists.txt"]
game_env = "VIPORT_GAME_DIR"
cache_env = "VIPORT_CACHE_DIR"
agility = false

[env]   # none: README sets no defaults
