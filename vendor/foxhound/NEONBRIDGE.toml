# Launcher spec for vendor/foxhound: readmet3xt-lab's foxhound.
# Build, run and env are its README and scripts/play-foxhound.ps1 (Series X, 1440p); Play-VIctory.cmd -> preset_play_victory.
name = "foxhound"
fork = "VIctory"
gpu = "NVIDIA"   # the card it is tuned for (README "Tuned for"; the picker's filter)
rank = 34   # i95 rank: score 59.3 by PortWatch VI's formula (from the author's report; scripts/rank.py)
about = "foxhound 7c53527 (GPL-3.0): 30 fps (the title's cap) on a 4070 SUPER + 7800X3D, 16-21 fps in heavier scenes; not yet run here"
upstream = "https://github.com/readmet3xt-lab/foxhound"
updated = "2026-11-28 05:57"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 131   # GitHub stars when last checked
build = ["cargo", "build", "--release", "--locked", "-p", "victory"]   # README.md:76
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
exe = "target/release/victory.exe"   # play-foxhound.ps1:22,85
diag_build = ["cargo", "build", "--profile", "diag", "-p", "victory", "--features", "diagnostics", "--locked"]   # Cargo.toml:76 (+--locked)
diag_exe = "target/diag/victory.exe"   # play-foxhound.ps1:8 -Build diag
cwd = "target/release"
run = ["run", "{game_exe}", "--console", "series-x", "--execute"]   # play-foxhound.ps1:83,128
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
prewarm = ["shaders", "{game}"]   # play-foxhound.ps1:115 (then warm, :119)
agility = false

# DLSS / frame generation: put the files of NVIDIA Streamline SDK bin\x64 in %LOCALAPPDATA%\6ixpack\streamline (not shipped: NVIDIA licence)
preset_series_s = ["--console=series-s", "VICTORY_NATIVE_1440P="]   # play-foxhound.ps1:7,68 -SeriesS
preset_1080to1440 = ["VICTORY_NATIVE_1440P=", "VICTORY_RENDER_1080P=1"]   # play-foxhound.ps1:70 -Res 1080to1440
preset_4k = ["VICTORY_NATIVE_1440P="]   # play-foxhound.ps1:24-26 -Res 4k
preset_dlss = ["VICTORY_DLSS=1", "VICTORY_DLSS_MODE=quality", "VICTORY_STREAMLINE_DIR=%LOCALAPPDATA%\\6ixpack\\streamline"]   # play-foxhound.ps1:72-80 (its default when Streamline is found; set your dir)
preset_framegen = ["VICTORY_DLSS=1", "VICTORY_DLSS_MODE=quality", "VICTORY_STREAMLINE_DIR=%LOCALAPPDATA%\\6ixpack\\streamline", "VICTORY_FRAMEGEN=1"]   # play-foxhound.ps1:76 -FrameGen
preset_60fps = ["VICTORY_FRAME_INTERVAL_US=16667"]   # play-foxhound.ps1:81 -Fps 60
preset_play_victory = ["--console=series-s", "VICTORY_NATIVE_1440P=", "VICTORY_LEVELS_ON_DEMAND=1", "VICTORY_LOG=warn"]   # Play-VIctory.cmd:18-39 (its pareto set; foxhound's extra switches stay on)
preset_dred = ["NEONBRIDGE_DIAG=1", "VICTORY_D3D12_DRED=1"]

# NVIDIA Streamline SDK v2.14.16 (the version its author tested) from NVIDIA-RTX/Streamline releases, its bin\x64 into %LOCALAPPDATA%\6ixpack\streamline for the DLSS presets
setup = [
  "streamline: powershell -NoProfile -Command \"$d=Join-Path $env:LOCALAPPDATA '6ixpack\\streamline'; if (-not (Test-Path (Join-Path $d 'sl.interposer.dll'))) { $t=Join-Path $env:TEMP 'streamline-sdk-v2.14.16.zip'; Invoke-WebRequest -UseBasicParsing https://github.com/NVIDIA-RTX/Streamline/releases/download/v2.14.16/streamline-sdk-v2.14.16.zip -OutFile $t; $x=Join-Path $env:TEMP 'streamline-sdk-v2.14.16'; Expand-Archive -Force $t $x; New-Item -ItemType Directory -Force $d | Out-Null; $b=(Get-ChildItem $x -Recurse -Directory -Filter x64 | Where-Object { $_.Parent.Name -eq 'bin' } | Select-Object -First 1).FullName; Copy-Item (Join-Path $b '*') $d -Recurse -Force; Remove-Item -Recurse -Force $t,$x }\" [asks first: download]",
]

[env]   # play-foxhound.ps1:38-70 (Series X, -Res 1440); VICTORY_HOST_WAVE=32 is set only for its prepare step (:105)
VICTORY_DATA_DIR = "%LOCALAPPDATA%\\6ixpack\\save"   # i95: one save/settings folder for the victory family
VICTORY_THIN = "1"
VICTORY_JOIN_PARTS = "8"
VICTORY_RELAY = "2"
VICTORY_RELAY_COPY = "1"
VICTORY_WIDE_BACK = "1"
VICTORY_CARD_REHASH_RUNS = "1"
VICTORY_JOIN_COPIES = "1"
VICTORY_CARD_STEPS = "2"
VICTORY_CARD_AWAKE = "1"
VICTORY_CARD_BUFFERS_MIN_KB = "64"
VICTORY_INDIRECT_WINDOW = "1"
VICTORY_INDIRECT_BATCH = "2"
VICTORY_UPLOAD_AHEAD = "1"
VICTORY_SHOW_AFTER = "1"
VICTORY_MAP_THREADS = "1"
VICTORY_WC_NO_BACK = "1"
VICTORY_WC_NO_BACK_MIN_KB = "1024"
VICTORY_SOFT_VIEWS = "copies"
VICTORY_TEXTURE_POOL = "1"
VICTORY_RIPE_BLOCKS = "0"
VICTORY_TEXTURE_NO_WAIT = "1"
VICTORY_TEXTURE_CATCHUP = "0"
VICTORY_TEXTURE_STAGE_MS = "16"
VICTORY_LEVELS_ON_DEMAND = "0"
VICTORY_PRELUDE_UPLOADS = "1"
VICTORY_SHOW_NEW_LATER = "1"
VICTORY_POOL_SMALL = "0"
VICTORY_TABLED_REREAD = "1"
VICTORY_QUEUE_HOST_TEXTURES = "0"
VICTORY_TEXSPK_PASS_MS = "8"   # play-foxhound.ps1:54
VICTORY_PASSES_HOT = "1"
VICTORY_HEAP_SYNC_FIRST = "1"
VICTORY_SYNC_IN_PLACE = "1"
VICTORY_SPANS_QUICK = "1"
VICTORY_SYNC_FINE = "1"
VICTORY_HEAP_SYNC_AT_SUBMIT = "1"
VICTORY_HELPER_PRIORITY = "1"
VICTORY_AMBIENT = "0.8"
VICTORY_AMBIENT_AIR = "1.5"
VICTORY_AMBIENT_SPECULAR = "1"
VICTORY_EARLY_DEPTH = "1"
VICTORY_LEAVE_OUT = "02384a60fda6f2d0,731a39171b568298"
VICTORY_PIPELINE_BOOK = "1"
VICTORY_NATIVE_1440P = "1"
