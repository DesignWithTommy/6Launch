# Neonbridge launcher spec for vendor/razda4a: crossducking's RAZDA4A-XEN (a Marvisak/VIctory fork for AMD RDNA).
# Run and env are its "RAZDA4A XEN.bat" (balanced profile, FSR frame generation on). It ships a prebuilt
# RAZDA4A_XEN.exe and no sources, so nothing is built here: the author's exe runs as committed.
name = "razda4a"
fork = "VIctory"
gpu = "AMD"   # the card it is tuned for (README "Tuned for"; the picker's filter)
rank = 12   # i95 rank: score 65.1 by PortWatch VI's formula (i95's assessment from its author's report; scripts/rank.py)
about = "RAZDA4A-XEN a882361 (GPL-3.0): crossducking's VIctory fork for AMD RDNA: 15.2 to 23.4 fps native in the open world (14.1 for its base), 29 to 31 shown with FSR 3.1 frame generation; a prebuilt exe, no sources"
upstream = "https://github.com/crossducking/RAZDA4A-XEN"
updated = "2026-11-27 20:18"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 191   # GitHub stars when last checked
exe = "RAZDA4A_XEN.exe"   # committed prebuilt (RAZDA4A XEN.bat:189)
run = ["run", "--console", "series-s", "{game_exe}", "--execute"]   # RAZDA4A XEN.bat:189
prewarm = ["warm", "--used", "--jobs", "6"]   # warm_shaders.bat
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false   # its exe dir ships D3D12 (Win10 Agility SDK, per its header)

preset_no_fg = ["VICTORY_FIDELITYFX_FRAMEGEN=0", "VICTORY_FRAMEGEN_AHEAD=", "VICTORY_FRAMEGEN_HUDLESS="]   # presets/3_Native_No_FG_Zero_Latency.bat
preset_low_commit = ["VICTORY_FILE_PHYSICAL=1"]   # XEN_PROFILE=low_commit
preset_cbv_exp = ["VICTORY_PORT_CBV=1", "VICTORY_PORT_CBV_PLACE=1", "VICTORY_PORT_CBV_SHADOW=2"]   # XEN_PROFILE=cbv_exp
preset_safe = ["VICTORY_ALLOW_TEARING=0", "VICTORY_VSYNC=1", "VICTORY_HELPER_PRIORITY=0", "VICTORY_SUBMIT_FRAMES=1", "VICTORY_JOIN_PARTS=12", "VICTORY_PORT_DESCRIPTORS=0", "VICTORY_PIPELINE_WORKERS=2", "VICTORY_SEGMENT_TIGHT=85", "VICTORY_TEXTURE_KEEP_PERCENT=40", "VICTORY_TEXTURE_STAGE_MB=64", "VICTORY_STAGING_MAX_MB=96", "VICTORY_STAGING_IDLE_MS=1000", "VICTORY_WINDOW_BUDGET_MB=96", "VICTORY_WINDOW_IDLE_MS=2000", "VICTORY_SEND_SPARE_MB=24", "VICTORY_CARD_BUFFERS_MIN_KB=256", "VICTORY_CARD_BUFFERS_MB=1280", "VICTORY_CARD_ROOM_FOR_TARGETS_MB=1536", "VICTORY_LIST_IDLE_MOST=128", "VICTORY_LIST_IDLE_TRIM_S=30", "VICTORY_LATE_WAIT_LISTS=128", "VICTORY_SNAPSHOT_POOL=24", "VICTORY_FILE_PHYSICAL=1"]   # XEN_PROFILE=safe (8-12 GB cards)

[env]   # "RAZDA4A XEN.bat" (XEN_PROFILE=balanced, XEN_FRAMEGEN=1)
VICTORY_DATA_DIR = "{root}\\data"
VICTORY_FIDELITYFX_DIR = "{root}\\fidelityfx"
VICTORY_LOG = "info"
VICTORY_FSR_PC = "1"
VICTORY_AMBIENT = "0.75"
VICTORY_AMBIENT_AIR = "1.5"
