name = "neptune"
fork = "VIctory"
gpu = "NVIDIA 8 GB"   # the card it is tuned for (README "Tuned for"; the picker's filter)
rank = 12   # i95 rank: score 63.3 by PortWatch VI's formula (from the author's report; scripts/rank.py)
about = "Neptune (neptune-dolberth-nvidia-8gb) 99b231f (GPL-3.0): no fps figure in its README, tuned for 8 GB NVIDIA + 6-core Ryzen + 16 GB RAM; not yet run here"
upstream = "https://github.com/Dolberthi/neptune-dolberth-nvidia-8gb"
updated = "2026-11-26 18:37"   # the pinned upstream commit's date (scripts/runtime-info.py)
stars = 20   # GitHub stars when last checked
build = ["cargo", "build", "--release", "-p", "victory", "--locked"]   # README.md:83; run-neptune.ps1:33 (+--locked)
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
exe = "target/release/victory.exe"   # run-neptune.ps1:31
diag_build = ["cargo", "build", "--profile", "diag", "-p", "victory", "--features", "diagnostics", "--locked"]   # Cargo.toml:81 [profile.diag]; neptune-diag.ps1 is only a log reader
diag_exe = "target/diag/victory.exe"
cwd = "target/release"   # run-neptune.ps1:203
run = ["run", "{game_exe}", "--execute", "--console", "series-s"]   # run-neptune.ps1:152,202 (series-s unless -SeriesX)
game_env = "VICTORY_GAME_DIR"   # run-neptune.ps1:158
cache_env = "VICTORY_CACHE_DIR"   # Neonbridge: this runtime's own cache dir
prewarm = ["warm"]   # run-neptune.ps1:177 (auto one-time warm before launch)
agility = false   # cargo build copies redist/D3D12 (Agility 1.620.2) to target/release/D3D12 (README.md:62); run-neptune.ps1:45-52 refetches it
preset_series_x = ["--console=series-x", "VICTORY_RESOLUTION=1920x1080"]   # run-neptune.ps1 -SeriesX (:152,155)
preset_taa = ["VICTORY_TAA=1"]   # run-neptune.ps1 -Taa
preset_no_thin = ["VICTORY_THIN="]   # run-neptune.ps1 -NoThin
preset_sync_submit = ["VICTORY_ASYNC_SUBMIT=", "VICTORY_ASYNC_PRESENT="]   # run-neptune.ps1 -SyncSubmit
preset_raw_indirect = ["VICTORY_INDIRECT_RAW=2"]   # run-neptune.ps1 -RawIndirect
preset_texture_2048 = ["VICTORY_TEXTURE_MAX_DIM=2048"]   # run-neptune.ps1 -TextureMaxDim 2048 (usage line 6)
preset_window_1600 = ["VICTORY_WINDOW_SIZE=1600x900"]   # run-neptune.ps1 -Window 1600x900 (usage line 7)
preset_dred = ["VICTORY_D3D12_DRED=1"]   # run-neptune.ps1 -Dred
# neptune-turbo.ps1 is a PC-prep/telemetry tool (power plan, closes NVIDIA Broadcast/Overlay, stops Sunshine); it sets no
# runtime switches, so there is no preset_turbo. neptune-diag.ps1 only reads the log. VICTORY_AMBIENT_FILE (ambient.txt
# written by run-neptune.ps1:139-141) is left out.

[env]   # run-neptune.ps1:54-150, its default profile
VICTORY_DATA_DIR = "%LOCALAPPDATA%\\6ixpack\\save"   # i95: one save/settings folder for the victory family
