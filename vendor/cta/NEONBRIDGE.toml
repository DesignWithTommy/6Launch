name = "cta"
pin = true   # i95 picker: listed first as "Ours" (not a tracker rank)
fork = "VIctory"
about = "ClaudeTheftAuto (GPL-3.0): Vice-Tay plus CTA's patches, built in place from the CTA checkout (vendor/cta/tree: a junction to ..\\Vnity\\vendor\\vicetay, made by hand; not in git); rebuilt only when its sources change"
upstream = "https://github.com/DesignWithTommy/ClaudeTheftAuto"
# The tree is CTA's own (Vnity\\vendor\\vicetay with patches/*.patch applied by `cta setup`); reached through the tree junction.
build = ["cargo", "build", "--locked", "--profile", "diag", "-p", "victory", "--features", "diagnostics", "--manifest-path", "tree/Cargo.toml"]
exe = "tree/target/diag/victory.exe"
diag_build = []
run = ["run", "{game_exe}", "--console", "series-x", "--execute"]   # as Vice-Tay (CTA runs it through vicetay scripts/play.ps1: cta/src/run.rs)
prewarm = ["shaders", "{game}/shaders.rpf", "{game_exe}", "{game}/XboxBvhBuilder.dll", "{game}/amd_fidelityfx_upscaler_xbox.dll", "--jobs", "{jobs}"]
watch = ["tree/apps", "tree/crates", "tree/Cargo.toml", "tree/Cargo.lock"]
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false
# Presets: Vice-Tay's (play.ps1 switches; CTA passes them through), then CTA's own presets/*.toml.
preset_7900xtx = ["VICTORY_THIN_THREADS=", "VICTORY_UNDER_THREADS=", "VICTORY_LAND_THREADS=", "VICTORY_PLACED_ORDER=", "VICTORY_PLACED_FILL_REDIRECT=", "VICTORY_WAVE_WIDE_ONLY=", "VICTORY_MAP_THREADS=1", "VICTORY_CARD_AWAKE=1"]   # play.ps1 -Machine 7900xtx (play.ps1:32-35; auto picks it on a non-NVIDIA card)
preset_safe = ["VICTORY_THIN=", "VICTORY_JOIN_PARTS=", "VICTORY_UPLOAD_AHEAD=", "VICTORY_INDIRECT_BATCH=", "VICTORY_MAP_THREADS=", "VICTORY_PLACED_ORDER=", "VICTORY_PLACED_FILL_REDIRECT=", "VICTORY_UNDER_WIDE=0", "VICTORY_LAND_ECHO=0"]   # play.ps1 -Safe (play.ps1:41-49,58-65)
preset_ray_tracing = ["VICTORY_BVH_BUILDER=1"]   # play.ps1 -RayTracing (play.ps1:66)
preset_windowed = ["VICTORY_FULLSCREEN="]   # play.ps1 -Windowed (play.ps1:68)
preset_dred = ["NEONBRIDGE_DIAG=1", "VICTORY_D3D12_DRED=1"]   # full D3D12 breadcrumbs (play.ps1 sets faults); read in crates/victory-gpu/src/host.rs
preset_warp = ["NEONBRIDGE_DIAG=1", "VICTORY_D3D12_WARP=1"]   # software GPU (slow; crates/victory-gpu/src/host.rs, diagnostics build)
preset_8gb = ["VICTORY_RELAY=0", "VICTORY_CARD_BUFFERS_MB=1024", "VICTORY_TEXTURE_BUDGET_MB=5120", "VICTORY_PAGE_WRITES=slots", "VICTORY_AMBIENT=0.6", "VICTORY_TEXTURE_NO_WAIT=1", "VICTORY_WIDE_REFRESH=1", "VICTORY_WIDE_MERGE=1", "VICTORY_JOIN_COPIES=1", "VICTORY_DISPLAY_MODE=1920x1080"]   # VItoriaBr's 8 GB setting (its README.md:290-305), the switches this tree reads (VICTORY_FILL_WAIT is not)   (CTA: Series S dropped, black picture on CTA: FidelityFX dll refused)
preset_4070 = ["VICTORY_THIN_THREADS=8", "VICTORY_UNDER_THREADS=6", "VICTORY_LAND_THREADS=4", "VICTORY_MAP_THREADS=1", "VICTORY_PIPELINE_WORKERS=3", "VICTORY_CARD_RESERVE_BUDGETS=1", "VICTORY_CARD_BUFFERS_MIN_KB=64", "VICTORY_CARD_BUFFERS_MB=1536", "VICTORY_CARD_WINDOWS_MB=1024"]   # play.ps1 -Machine 4070 (a252348:62-73)
preset_4070tisuper = ["VICTORY_THIN_THREADS=8", "VICTORY_UNDER_THREADS=6", "VICTORY_LAND_THREADS=4", "VICTORY_MAP_THREADS=1", "VICTORY_PIPELINE_WORKERS=3", "VICTORY_CARD_RESERVE_BUDGETS=1", "VICTORY_CARD_BUFFERS_MIN_KB=64", "VICTORY_CARD_BUFFERS_MB=1536", "VICTORY_CARD_WINDOWS_MB=1024", "VICTORY_WINDOWS_BAR_MB=4096"]   # play.ps1 -Machine 4070tisuper (#278): needs Resizable BAR
preset_16gb_ram = ["VICTORY_THIN_THREADS=6", "VICTORY_UNDER_THREADS=4", "VICTORY_LAND_THREADS=3", "VICTORY_MAP_THREADS=1", "VICTORY_PIPELINE_WORKERS=2", "VICTORY_SNAPSHOT_POOL=256", "VICTORY_KEEP_SNAPSHOTS_MB=64", "VICTORY_DSTORAGE_STAGING_MB=128", "VICTORY_TEXTURE_STAGE_MB=128"]   # ours: Series S with fewer worker threads and smaller snapshot/staging pools (defaults 1024 / 256 MB / 256 MB) for 16 GB PCs; untested by its author   (CTA: Series S dropped, black picture on CTA: FidelityFX dll refused)
preset_3060 = ["VICTORY_THIN_THREADS=6", "VICTORY_UNDER_THREADS=4", "VICTORY_LAND_THREADS=3", "VICTORY_MAP_THREADS=auto", "VICTORY_PIPELINE_WORKERS=3", "VICTORY_CARD_RESERVE_BUDGETS=1", "VICTORY_CARD_BUFFERS_MIN_KB=64", "VICTORY_CARD_BUFFERS_MB=1536", "VICTORY_CARD_WINDOWS_MB=1024", "VICTORY_WINDOWS_BAR_MB=3072"]   # play.ps1 -Machine 3060 (:92-112): i5-12400F, RTX 3060 12 GB, 16 GB RAM; needs Resizable BAR
preset_4060 = ["VICTORY_THIN_THREADS=6", "VICTORY_UNDER_THREADS=4", "VICTORY_LAND_THREADS=3", "VICTORY_MAP_THREADS=1", "VICTORY_PIPELINE_WORKERS=2", "VICTORY_SNAPSHOT_POOL=256", "VICTORY_KEEP_SNAPSHOTS_MB=64", "VICTORY_DSTORAGE_STAGING_MB=128", "VICTORY_TEXTURE_STAGE_MB=128", "VICTORY_CARD_RESERVE_BUDGETS=1", "VICTORY_CARD_BUFFERS_MIN_KB=64", "VICTORY_CARD_BUFFERS_MB=1024", "VICTORY_CARD_WINDOWS_MB=512", "VICTORY_TEXTURE_BUDGET_MB=4096", "VICTORY_OUTPUT=1920x1080"]   # ours: 8 GB card + 16 GB RAM, its 4070 profile scaled down; ~16 fps in the first room on an RTX 4060 here (rough picture)   (CTA: Series S dropped, black picture on CTA: FidelityFX dll refused)
preset_laptop = ["VICTORY_DSTORAGE_IO=direct", "VICTORY_INPLACE=2", "VICTORY_WINDOW_KB=64", "VICTORY_WINDOW_TAILS=1", "VICTORY_WINDOWS_BAR_MB=3072", "VICTORY_CARD_BUFFERS_MB=256", "VICTORY_LEVELS_ON_DEMAND=1", "VICTORY_WORKING_SET_MB=4500", "VICTORY_OUTPUT=1920x1080", "VICTORY_UPSCALER=6", "VICTORY_RENDER_SCALE=0.5"]   # play.ps1 -Machine laptop: NVIDIA PC with 16 GB RAM and a 6-8 GB card (docs/laptop-16gb.md; working set = RAM MB - 11624, 4500 on 16 GB)
preset_dlss_4k = ["VICTORY_DLSS_4K=quality"]   # play.ps1 -Dlss4K quality: Series X upscaled to 3840x2160 by DLSS (RTX; NGX uses the driver's copy, README.md:95-97); FSR if it cannot start
preset_framegen = ["VICTORY_FRAMEGEN=1"]   # play.ps1 -FrameGen: AMD frame generation
preset_fsr = ["VICTORY_UPSCALER=", "VICTORY_FSR=quality"]   # play.ps1 -Console series-s -Fsr quality: PC FidelityFX upscaling   (CTA: Series S dropped, black picture on CTA: FidelityFX dll refused)
preset_dlss = ["VICTORY_UPSCALER=", "VICTORY_DLSS=quality"]   # play.ps1 -Console series-s -Dlss quality (RTX)   (CTA: Series S dropped, black picture on CTA: FidelityFX dll refused)
preset_warm_all = ["VICTORY_EARLY_ALL=1", "VICTORY_PIPELINE_BOOK=1"]   # ours: every pipeline the title creates is built at creation (library.rs wanted_early: the driver cache keeps it for later runs) and recorded (known.rs); shaders are already translated ahead by prewarm. First run with it is slower, later runs stutter less; untested
preset_nvidia_10_14gb = ["VICTORY_CARD_RESERVE_BUDGETS=1", "VICTORY_CARD_BUFFERS_MIN_KB=64", "VICTORY_CARD_BUFFERS_MB=1536", "VICTORY_CARD_WINDOWS_MB=1024"]   # play.ps1 -Machine auto on a 10-14 GB NVIDIA card: title buffers in the card's memory (16 vs 29 fps on a 5080, docs/rtx5080-16gb.md)
preset_nvidia_15_19gb = ["VICTORY_CARD_RESERVE_BUDGETS=1", "VICTORY_CARD_BUFFERS_MIN_KB=64", "VICTORY_CARD_BUFFERS_MB=1536", "VICTORY_CARD_WINDOWS_MB=1024", "VICTORY_WINDOWS_BAR_MB=4096"]   # play.ps1 -Machine auto on a 15-19 GB NVIDIA card
preset_measure = ["VICTORY_WATCH_STATS=1", "VICTORY_COMMIT_BREAKDOWN=1", "VICTORY_MEM_STATS_MS=5000", "VICTORY_CARD_MEMORY=1", "VICTORY_PASS_TIMES=1", "VICTORY_TABLE_COUNTS=1", "VICTORY_FENCE_WAIT_LOG_MS=16", "VICTORY_WAIT_LOGS=1", "VICTORY_PIPELINE_MISS_LOG=1", "VICTORY_COMPILE_START_LOG=1", "VICTORY_SAVE_LOG=1"]   # CTA presets/measure.toml
preset_ram = ["VICTORY_POOL_DISCARD=1", "VICTORY_POOL_DISCARD_BELOW_MB=0", "VICTORY_STAGING_PACK=1", "VICTORY_STAGING_SPARE_BLOCKS=2", "VICTORY_STAGING_REST_MS=250", "VICTORY_COMMIT_RESERVE_MB=2048", "VICTORY_LIST_POOL_CAP=256", "VICTORY_TEXTURE_IDLE_MS=2000", "VICTORY_RENDER_SCALE=0.5"]   # CTA presets/ram.toml (RTX 4060 8 GB, 16 GB RAM)
preset_fastest = ["VICTORY_INDIRECT_MERGE=1", "VICTORY_HEAP_PASS_MARKED=1"]   # CTA measured: INDIRECT_MERGE 6.4 fps, HEAP_PASS_MARKED 6.1 (4060, single runs); avoid REBAR=1, LIST_REUSE, COPY_PLAIN on 8 GB

[env]   # Vice-Tay play.ps1 default set (what `cta run` gets), plus CTA's data dir and 1080p
VICTORY_DATA_DIR = "%LOCALAPPDATA%\\6ixpack\\save"   # i95 shared save; cta/src/run.rs sets the same
VICTORY_OUTPUT = "1920x1080"   # CTA: every test at 1080p
VICTORY_TEXTURE_NO_WAIT = "1"   # play.ps1:21-26 defaults
VICTORY_RELAY = "2"
VICTORY_WIDE_BACK = "1"
VICTORY_CARD_REHASH_RUNS = "1"
VICTORY_JOIN_COPIES = "1"
VICTORY_INDIRECT_WINDOW = "1"
VICTORY_RELAY_COPY = "1"
VICTORY_CARD_STEPS = "2"
VICTORY_TITLE_PRIORITIES = "0"
VICTORY_SHOW_AFTER = "1"
VICTORY_AMBIENT = "0.8"
VICTORY_D3D12_DRED = "faults"   # play.ps1 (#274): page faults kept as the launcher default
VICTORY_THIN_THREADS = "12"   # play.ps1:36-57: -Machine auto on an NVIDIA card (4090 settings)
VICTORY_UNDER_THREADS = "8"
VICTORY_LAND_THREADS = "6"
VICTORY_MAP_THREADS = "auto"
VICTORY_PLACED_ORDER = "1"
VICTORY_PLACED_FILL_REDIRECT = "1"   # play.ps1: beside PLACED_ORDER (RTX 5080: fewer refused submissions)
VICTORY_WAVE_WIDE_ONLY = "6f225b641c5b0708,5dc3b25986622949,369cbe906ea72764,2cc4c197ee29e291"
VICTORY_THIN = "1"   # play.ps1:60-65 (not -Safe)
VICTORY_JOIN_PARTS = "8"
VICTORY_UPLOAD_AHEAD = "1"
VICTORY_INDIRECT_BATCH = "2"
VICTORY_FULLSCREEN = "1"   # play.ps1:68 (not -Windowed)

[controls]
left_stick = "W A S D"
right_stick = "I J K L"
a = "Enter"
b = "Backspace"
x = "X"
y = "Y"
lb = "Q"
rb = "E"
lt = "Z"
rt = "C"
ls = "F"
rs = "H"
dpad = "Arrows"
view = "Tab"
menu = "Esc"
