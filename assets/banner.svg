<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="i95: GTA VI (GTA 6) Xbox Series launcher for Windows PC">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120826"/>
      <stop offset="0.55" stop-color="#5c1260"/>
      <stop offset="1" stop-color="#ff7a3c"/>
    </linearGradient>
    <clipPath id="sunclip"><circle cx="1020" cy="200" r="150"/></clipPath>
  </defs>
  <rect width="1280" height="258" fill="url(#sky)"/>
  <!-- striped setting sun -->
  <g clip-path="url(#sunclip)">
    <rect x="860" y="40" width="320" height="220" fill="#ffc446"/>
    <rect x="860" y="178" width="320" height="3" fill="#d2504e"/>
    <rect x="860" y="198" width="320" height="5" fill="#e0584c"/>
    <rect x="860" y="218" width="320" height="7" fill="#ec6246"/>
    <rect x="860" y="238" width="320" height="9" fill="#f66c40"/>
  </g>
  <!-- ground and horizon -->
  <rect y="258" width="1280" height="142" fill="#0e061a"/>
  <rect y="258" width="1280" height="4" fill="#ff2e97"/>
  <!-- wordmark -->
  <g font-family="'Segoe UI Black','Segoe UI','Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-style="italic" font-size="170">
    <text x="88" y="210" fill="#ff2e97">i95</text>
    <text x="78" y="200" fill="#ffffff">i95</text>
  </g>
  <text x="84" y="302" fill="#c8c8dc" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="26">Every GTA VI Xbox Series runtime on PC, from one window</text>
  <!-- road -->
  <rect x="80" y="332" width="1120" height="44" fill="#221e2c"/>
  <rect x="80" y="332" width="1120" height="3" fill="#968caa"/>
  <rect x="80" y="373" width="1120" height="3" fill="#968caa"/>
  <path d="M80 354H860" stroke="#ffc83c" stroke-width="5" stroke-dasharray="28 20"/>
  <!-- tyre smoke -->
  <circle cx="812" cy="350" r="9" fill="#96969f" opacity="0.8"/>
  <circle cx="796" cy="356" r="7" fill="#80808a" opacity="0.6"/>
  <circle cx="782" cy="351" r="5" fill="#6a6a74" opacity="0.45"/>
  <!-- drift car -->
  <g transform="translate(852 354) rotate(-14)">
    <rect x="-26" y="-12" width="52" height="24" fill="#ff2e97"/>
    <rect x="6" y="-8" width="10" height="16" fill="#00e5ff"/>
    <rect x="-26" y="-12" width="4" height="6" fill="#ff3c3c"/>
    <rect x="-26" y="6" width="4" height="6" fill="#ff3c3c"/>
  </g>
</svg>
