# Update loop: every 6 hours each runtime's pin moves to its author's newest
# commit, so launchers pick it up from catalog.txt on their next start.
name: update loop
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move pins to the newest upstream commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/bump-upstreams.sh
      - name: Commit
        run: |
          [ -s /tmp/bumped.txt ] || exit 0
          git config user.name "i95 update loop"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.txt vendor/*/UPSTREAM
          git commit -q -m "Upstreams pulled by the update loop: $(paste -sd, /tmp/bumped.txt)"
          git push -q
